<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1eedf"><meta name="description" content="下课别走：阳光教室里的校园捣蛋游戏。观察老师，和四位 AI 同学配合，偷偷完成课堂小动作。">
  <title>下课别走 · 校园派对</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232d786c'/%3E%3Cpath d='M16 18h32v25H16z' fill='%23fff6dd'/%3E%3Cpath d='M25 49h14M32 43v6M24 27h16M24 34h10' stroke='%232d786c' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=10">

</head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-3c0-6 16-6 16 0v3"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 3-1 3 3 1 1 3h6l1-3 3-1-1-3 2-3-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm13-1c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
<symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm13 0 5 6m0-6-5 6"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Zm0 0v15"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M4 17h16l-2-3V9a6 6 0 0 0-12 0v5Zm5 4h6M12 1v2"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
</defs></svg>

<main id="game">
  <div class="scene-fallback" aria-hidden="true"></div>
  <canvas id="classroom" tabindex="0" aria-label="阳光教室的三维场景"></canvas>
  <div class="scene-shade" aria-hidden="true"></div>
  <div class="screen-grain" aria-hidden="true"></div>
  <div id="menu" class="menu-shell">
    <header class="topbar"><span></span>
      <div class="top-actions"><button class="icon-button" id="sound-toggle" aria-label="关闭声音" title="声音"><svg><use href="#i-audio"/></svg></button><button class="icon-button" id="fullscreen" aria-label="全屏" title="全屏"><svg><use href="#i-expand"/></svg></button></div>
    </header>
    <section class="menu-left" aria-label="主菜单">
      <div class="brand"><h1 class="title-image"><img src="./assets/title-logo.png" alt="下课别走" width="1250" height="1250"></h1></div>
      <div class="menu-controls">
        <button class="mode-summary" id="choose-mode" aria-haspopup="dialog"><span class="mode-book"><svg><use href="#i-book"/></svg></span><span><strong>课堂捣蛋</strong></span><span class="mode-switch"><svg><use href="#i-arrow"/></svg></span></button>
        <button class="primary-button" id="enter-classroom"><span><strong>开始上课</strong></span><svg><use href="#i-arrow"/></svg></button>
        <div class="secondary-row"><button class="paper-button" id="choose-character" aria-haspopup="dialog"><svg><use href="#i-person"/></svg>我的同学</button><button class="paper-button" id="open-settings" aria-haspopup="dialog"><svg><use href="#i-settings"/></svg>设置</button></div>
      </div>
    </section>

    <footer class="footer"><span>课堂试玩 <i>·</i> 0.5</span></footer>
  </div>

  <section id="play-ui" hidden aria-label="课堂游戏">
    <header class="play-top"><div class="round-clock"><svg><use href="#i-person"/></svg><strong id="round-clock">5 / 5</strong></div><div class="round-goal"><div><span>捣乱值</span><strong id="round-score">0</strong><small id="round-target">/ 100</small></div><div class="goal-track"><i id="score-fill"></i></div></div><button class="icon-button" id="pause-game" aria-label="暂停游戏"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></header>
    <div class="teacher-watch"><div id="teacher-state">老师在写板书</div><div id="notice-meter" role="progressbar" aria-label="老师的怀疑程度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="notice-fill"></i></div><div id="strikes"><span>被发现</span><b id="strike-count">0 / 3</b></div></div>
    <i id="crosshair" hidden aria-hidden="true"></i><div id="classmates" aria-label="同学状态"></div><div id="round-feedback" aria-live="polite"></div>
    <div id="speech" hidden role="status"><b id="speech-name"></b><span id="speech-text"></span></div>
    <footer class="play-bottom"><div id="control-hint">1 / 2 / 3 选物品 · 左键或空格使用 · E 起身 · WASD 移动 · C 蹲下</div><div class="action-dock">
      <button class="action-card" data-action="snack" aria-pressed="true"><kbd>1</kbd><svg viewBox="0 0 48 48"><path d="M12 8h24l-3 8 3 24H12l3-24Z" fill="#e6ad45"/><path d="M14 17h20v17H14" fill="#df6350"/><path d="M19 22h10M19 28h6" stroke="#fff5dc"/></svg><b>偷吃</b><i></i></button>
      <button class="action-card" data-action="note" aria-pressed="false"><kbd>2</kbd><svg viewBox="0 0 48 48"><path d="m8 11 32 7-15 7-7 14-10-28Z" fill="#fff9e8"/><path d="m8 11 17 14 15-7M25 25l-7 14"/></svg><b>传纸条</b><i></i></button>
      <button class="action-card" data-action="phone" aria-pressed="false"><kbd>3</kbd><svg viewBox="0 0 48 48"><rect x="13" y="5" width="22" height="38" rx="4" fill="#3f505e"/><path d="M17 11h14v24H17Z" fill="#90c9ce"/><path d="M22 39h4" stroke="#fff"/></svg><b>玩手机</b><i></i></button>
      <button id="hold-action" class="primary-button">按住使用</button><button id="interact-seat" class="help-button"><small>E</small><b id="seat-label">起身</b></button><button id="ask-help" class="help-button"><small id="help-cooldown">Q · 1</small><b>烟雾</b></button></div><div id="active-action">偷吃零食</div></footer>
  </section>
  <dialog id="pause-dialog" class="sheet round-sheet" aria-labelledby="pause-title"><h2 id="pause-title">歇一会儿</h2><button class="primary-button" id="resume-game">继续上课</button><button class="paper-button" id="restart-game">重新开始</button><button class="paper-button" id="leave-game">返回主菜单</button></dialog>
  <dialog id="result-dialog" class="sheet round-sheet" aria-labelledby="result-title"><span class="result-bell"><svg><use href="#i-bell"/></svg></span><h2 id="result-title">下课啦！</h2><div class="result-number"><strong id="result-score">0</strong><span id="result-goal">捣乱值</span></div><p id="result-detail"></p><p id="result-actions"></p><button class="primary-button" id="retry-game">再上一节</button><button class="paper-button" id="result-menu">返回主菜单</button></dialog>

  <div id="loader" class="loader"><div class="loader-card"><svg class="loader-bell"><use href="#i-bell"/></svg><p>下课别走</p><span id="load-status">正在打开教室</span><div class="loading-track"><span id="loading-fill"></span></div></div><button id="skip-load" class="paper-button" hidden>查看菜单</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="mode-dialog" class="sheet mode-sheet" aria-labelledby="mode-title"><div class="sheet-top"><div><h2 id="mode-title">选择玩法</h2></div><button class="icon-button close" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="mode-feature pending-art"><svg><use href="#i-book"/></svg><div class="feature-bottom"><h3>课堂捣蛋</h3><span>藏好东西，别露馅</span></div></div>
    <div class="mode-copy"><span class="preview-label">本地试玩 · 学生视角 · AI 老师与同学</span></div>
    <div class="planned-modes"><div><svg><use href="#i-lock"/></svg><span>课间追逐<small>待定玩法</small></span></div><div><svg><use href="#i-lock"/></svg><span>校园寻物<small>待定玩法</small></span></div></div>
    <button class="primary-button compact" id="select-classroom"><span>选择课堂捣蛋</span><svg><use href="#i-check"/></svg></button>
  </dialog>

  <dialog id="character-dialog" class="sheet character-sheet" aria-labelledby="character-title"><div class="sheet-top"><div><h2 id="character-title">选择同学</h2></div><button class="icon-button close" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="character-options" role="group" aria-label="选择同学"><button class="character-option" data-character="boy" aria-pressed="true"><span><strong>男同学</strong><svg><use href="#i-check"/></svg></span></button><button class="character-option" data-character="girl" aria-pressed="false"><span><strong>女同学</strong><svg><use href="#i-check"/></svg></span></button></div>
    <button class="primary-button compact" id="confirm-character"><span>确定</span><svg><use href="#i-check"/></svg></button>
  </dialog>

  <dialog id="settings-dialog" class="sheet settings-sheet" aria-labelledby="settings-title"><div class="sheet-top"><div><h2 id="settings-title">设置</h2></div><button class="icon-button close" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div class="settings-content"><label class="range-row" for="music-volume"><span>音乐<output id="music-output">25%</output></span><input type="range" id="music-volume" min="0" max="100" value="25"></label><label class="range-row" for="sfx-volume"><span>音效<output id="sfx-output">55%</output></span><input type="range" id="sfx-volume" min="0" max="100" value="55"></label>
    <div class="setting-row"><span>画面质量</span><div class="segmented" role="group" aria-label="画面质量"><button data-quality="high" aria-pressed="true">精致</button><button data-quality="low" aria-pressed="false">流畅</button></div></div>
    <label class="setting-row" for="motion-toggle"><span>场景动态</span><input id="motion-toggle" type="checkbox" class="switch" checked></label>
    </div><button class="primary-button compact close" id="settings-done"><span>完成</span><svg><use href="#i-check"/></svg></button>
  </dialog>
</main>
<script type="module" src="./app.js?v=10"></script>
</body></html>
