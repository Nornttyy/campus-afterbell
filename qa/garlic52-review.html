<!doctype html><html lang="zh"><meta charset="utf-8"><title>大蒜准星拾取实测</title><style>body{margin:0;background:#f5f7fa;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}nav{position:fixed;top:8px;left:8px;right:8px;padding:9px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:80px}button,select{padding:7px}#reticle{position:fixed;left:50%;top:50%;width:4px;height:4px;background:#fff;border:1px solid #122;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}output{position:fixed;bottom:8px;left:8px;background:#fff;padding:10px;white-space:pre;max-width:95vw}#result{position:fixed;top:80px;right:8px;background:#fff;padding:8px}</style><canvas></canvas><i id="reticle"></i><nav><label>座位朝向 <select id="orientation"><option value="0">正向</option><option value="3.141592653589793">反向四桌</option></select></label><label>物品 <select id="kind"><option>garlic</option><option>banana</option><option>burger</option><option>snack</option></select></label><button id="left">对准左格</button><button id="middle">对准中格</button><button id="right">对准右格</button><label>低头 <input id="pitch" type="number" step=".01" value="1.095"></label><label>左右 <input id="yaw" type="number" step=".01" value="0"></label><button id="interact">E 拿取/放回/开关抽屉</button><button id="use">使用三秒</button><button id="burp">喷出臭嗝</button><button id="reset">重置</button></nav><div id="result">准备中</div><output>加载中</output><script type="module">
import {createClassroom} from '../dist/classroom.js?v=campus-61';
import {ClassroomRound} from '../dist/classroom-rules.js?v=campus-61';
const canvas=document.querySelector('canvas'),view=await createClassroom(canvas),round=new ClassroomRound({seed:2,target:10000}),out=document.querySelector('output'),result=document.querySelector('#result'),yaw=document.querySelector('#yaw'),pitch=document.querySelector('#pitch'),orientation=document.querySelector('#orientation'),kind=document.querySelector('#kind');
let last=performance.now();
function sync(){round.setLook(Number(orientation.value)+Number(yaw.value),Number(pitch.value));}
function reset(){round.reset(2);round.start();round.teacher.x=round.teacher.z=30;round._thinkAt=round._plan.until=Infinity;for(const p of round.students){p._decisionAt=Infinity;p.seated=false;p.seatId=null;p.visible=false;}const seat=round.seats.find(s=>Math.abs(s.yaw-Number(orientation.value))<.01);Object.assign(round.player,{x:seat.x,z:seat.z});round.interact(seat.id);round.player.visible=true;round.player._slots=Array.from({length:3},(_,id)=>({id,action:kind.value,progress:0,readyAt:0}));round.player._selectedSlot=0;round.player._drawnSlot=null;round.selected=round.player.action=kind.value;round.player._drawerOpen=true;round.books[seat.id].raised=false;sync();result.textContent='准星对准物品按 E 拿取，再按 E 放回。';}
function aim(slot){yaw.value=String([-.6343,-.00137,.63267][slot]);pitch.value=String([1.00262,1.09502,1.00192][slot]);sync();}
function interact(){const target=view.getInteraction();let okay=false;if(round.snapshot().drawer.drawnSlot!==null)okay=round.returnItem();else if(target?.kind==='item')okay=round.takeSlot(target.slot);else if(target?.kind==='desk')okay=round.toggleDrawer();result.textContent=JSON.stringify({target,okay,holding:round.player._drawnSlot,item:round.player.action});}
reset();document.querySelector('#left').onclick=()=>aim(0);document.querySelector('#middle').onclick=()=>aim(1);document.querySelector('#right').onclick=()=>aim(2);document.querySelector('#interact').onclick=interact;document.querySelector('#reset').onclick=reset;kind.onchange=reset;orientation.onchange=reset;yaw.oninput=pitch.oninput=sync;
document.querySelector('#use').onclick=()=>{round.hold(true);setTimeout(()=>{round.releaseUse();result.textContent='使用结束，得分 '+round.score+'，臭嗝剩余 '+round.snapshot().player.burpReadyLeft;},3100);};
document.querySelector('#burp').onclick=()=>{const okay=round.burp();result.textContent=okay?'已喷出臭嗝':'需先吃大蒜，在5秒内喷出';};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='KeyE'&&!e.repeat)interact();});
canvas.onpointerdown=()=>canvas.requestPointerLock?.();addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;yaw.value=String(Number(yaw.value)+e.movementX*.0024);pitch.value=String(Math.max(-1.3,Math.min(1.3,Number(pitch.value)+e.movementY*.0024)));sync();});
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;round.step(dt);const s=round.snapshot();view.setGameplay(s);out.textContent=JSON.stringify({target:view.getInteraction(),drawn:s.drawer.drawnSlot,slots:s.drawer.slots.map(s=>s.action),drawer:s.drawer.open,score:s.score,burp:s.player.burpReadyLeft,seat:s.player.seatId,pitch:s.player.pitch,yaw:s.player.yaw},null,2);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
