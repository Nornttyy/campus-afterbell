<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门 · 正式场景检查</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui;color:#263a3e;background:#eef3f2}body{display:flex;flex-direction:column}fieldset{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:9px 12px;border:0;border-bottom:1px solid #a5b8b4;margin:0}button{padding:8px 12px;font:inherit;background:#fff;border:1px solid #91a6a4;border-radius:5px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#c2e6dd}button:disabled{opacity:.45}main{position:relative;flex:1;min-height:100px}canvas{width:100%;height:100%;display:block}output{position:absolute;top:12px;left:12px;white-space:pre;font:13px/1.6 ui-monospace,monospace;background:#fafff0e8;border:1px solid #b1c2ba;padding:10px 14px;pointer-events:none}#aim{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #58716b;transform:translate(-50%,-50%)}footer{padding:9px 12px;min-height:38px;border-top:1px solid #a5b8b4}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#edf4f1}#loading[hidden]{display:none}</style>
<fieldset id="controls" disabled><button data-door="front">前门</button><button data-door="rear">后门</button><button data-door="office">办公室门</button><button id="open">开门 · E 3秒</button><button id="close">关门 · Q 3秒</button><button id="cancel">取消交互</button><button id="walk">尝试走过门</button><button id="pause">暂停</button><button id="step">前进0.1秒</button><button data-stage="gathering">课间</button><button data-stage="seating">倒计时</button><button data-stage="class">课堂</button></fieldset>
<main><canvas id="canvas" tabindex="0" aria-label="正式教室门及碰撞检查"></canvas><i id="aim"></i><output id="state">加载真实模型…</output><div id="loading">正在加载正式场景…</div></main><footer id="message">按钮调用正式门交互；可按住 E 开、Q 关，WASD 使用真实移动和碰撞。</footer>
<script type="module">
import {createClassroom} from '../dist/classroom.js?v=campus-67';
import {ClassroomRound} from '../dist/classroom-rules.js?v=campus-67';
import {DOORS,OFFICE,START_BELL_POSITION,moveInRoom,clearWallSegment} from '../dist/classroom-layout.js?v=campus-67';
import {reachesSchoolDoor} from '../dist/door-interaction54.js?v=campus-67';
const $=id=>document.getElementById(id),canvas=$('canvas'),keys=new Set();let scene,round,current='front',last=0,walkTo=null,disposed=false,frameId=0;
const say=text=>$('message').textContent=text;
function doorPosition(amount=round.layout.doorMotion[current].amount){const a=amount*Math.PI/2;if(current==='office')return{x:OFFICE.doorMinX+.45*Math.cos(a),z:8.91+.45*Math.sin(a)};const d=DOORS.find(d=>d.id===current);return{x:7.30+.8*Math.sin(a),z:d.maxZ-.8*Math.cos(a)};}
function aim(){const t=doorPosition(),p=round.player;round.setLook(Math.atan2(t.x-p.x,t.z-p.z),.05);}
function view(id){current=id;walkTo=null;round.setDoorUse(false);round.setMovement(0,0);const d=DOORS.find(d=>d.id===id);Object.assign(round.player,id==='office'?{x:OFFICE.doorX,z:7.75,seated:false}:{x:6.50,z:d.center,seated:false});aim();for(const b of document.querySelectorAll('[data-door]'))b.setAttribute('aria-pressed',String(b.dataset.door===id));render();}
function setup(stage){keys.clear();walkTo=null;round=new ClassroomRound({seed:73});round.start({gathering:true});round.step(2);if(stage!=='gathering'){round.startBell();if(stage==='class')round.step(30);}scene.setGameplay(null);view(current);say(stage==='gathering'?'课间：三处门默认关闭，均可实际交互打开。':stage==='seating'?'倒计时：前后门打开供入座，办公室保持锁闭。':'课堂：办公室解锁并连续打开，普通门可自行开关。');last=performance.now();}
function use(closed){walkTo=null;round.setMovement(0,0);round.pause(false);aim();const ok=round.setDoorUse(true,closed,current);say(ok?`实际${closed?'关':'开'}门交互进行中；满 3 秒后门开始移动。`:current==='office'&&round.layout.officeLocked?'倒计时办公室锁闭，交互被正式规则拒绝。':'当前状态无需更改，或门附近有遮挡。');render();}
function render(){if(!round)return;const s=round.snapshot(),m=s.doorMotion[current],p=s.player,d=DOORS.find(d=>d.id===current),a=current==='office'?{x:OFFICE.doorX,z:8.2}:{x:6.7,z:d.center},b=current==='office'?{x:OFFICE.doorX,z:9.8}:{x:9.2,z:d.center};scene.setGameplay(s);const q=moveInRoom(a,b.x-a.x,b.z-a.z,.18,round.layout),pass=Math.hypot(q.x-b.x,q.z-b.z)<.03,hit=scene.getInteraction();$('state').textContent=`阶段 ${s.stage}  倒计时 ${s.stageTimeLeft.toFixed(1)}\n${current} 开合 ${(m.amount*100).toFixed(1)}% → ${m.target?'开':'关'}\n交互 ${((s.interaction.progress||0)*100).toFixed(1)}%  被人挡住 ${m.blocked?'是':'否'}\n办公室锁 ${s.officeLocked?'是':'否'}  可实际移动通过 ${pass?'是':'否'}\n门洞视线 ${clearWallSegment(a,b,round.layout)?'畅通':'阻挡'}  准星 ${hit?.doorId||hit?.kind||'—'}\n位置 ${p.x.toFixed(2)}, ${p.z.toFixed(2)}  可触达 ${reachesSchoolDoor(p,round.layout,current)}\n前/后/办公室 ${['front','rear','office'].map(id=>(s.doorMotion[id].amount*100).toFixed(0)+'%').join(' / ')}`;$('pause').textContent=s.paused?'继续':'暂停';canvas.dataset.qaState=JSON.stringify({stage:s.stage,doorMotion:s.doorMotion,officeLocked:s.officeLocked,current,pass,player:{x:p.x,z:p.z},interaction:s.interaction});}
for(const b of document.querySelectorAll('[data-door]'))b.onclick=()=>view(b.dataset.door);for(const b of document.querySelectorAll('[data-stage]'))b.onclick=()=>setup(b.dataset.stage);
$('open').onclick=()=>use(false);$('close').onclick=()=>use(true);$('cancel').onclick=()=>{round.setDoorUse(false);say('交互已取消。');};$('walk').onclick=()=>{round.setDoorUse(false);walkTo=current==='office'?{x:OFFICE.doorX,z:10.3}:{x:9.5,z:DOORS.find(d=>d.id===current).center};round.pause(false);say('使用正式 setMovement 移动；关着或正在挡路的门会阻止通过。');};$('pause').onclick=()=>{round.pause(!round.paused);render();};$('step').onclick=()=>{round.pause(false);round.step(.1);round.pause(true);render();};
addEventListener('keydown',e=>{if(!round)return;if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();keys.add(e.code);walkTo=null;}if(!e.repeat&&['KeyE','KeyQ'].includes(e.code)){e.preventDefault();use(e.code==='KeyQ');}});addEventListener('keyup',e=>{keys.delete(e.code);if(['KeyE','KeyQ'].includes(e.code))round?.setDoorUse(false);});addEventListener('blur',()=>{keys.clear();round?.setDoorUse(false);});
function frame(now){if(disposed)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!round.paused){if(walkTo){const dx=walkTo.x-round.player.x,dz=walkTo.z-round.player.z,d=Math.hypot(dx,dz);if(d<.05){walkTo=null;round.setMovement(0,0);}else round.setMovement(dx/d,dz/d);}else{const side=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),forward=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),yaw=round.player.yaw;round.setMovement(Math.cos(yaw)*side+Math.sin(yaw)*forward,-Math.sin(yaw)*side+Math.cos(yaw)*forward);}round.step(dt);round.drainEvents();}render();frameId=requestAnimationFrame(frame);}
try{scene=await createClassroom(canvas,{active:true,snapEntry:true});$('controls').disabled=false;$('loading').hidden=true;setup('gathering');frameId=requestAnimationFrame(frame);window.qaReady=true;}catch(error){$('loading').textContent='加载失败：'+error.message;console.error(error);}addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(frameId);scene?.dispose();},{once:true});
</script></html>
