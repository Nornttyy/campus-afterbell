<!doctype html><html lang="zh"><meta charset="utf-8"><title>校园地图 54 检视</title>
<style>html,body{margin:0;height:100%;background:#e5ebe7;font:14px sans-serif}[hidden]{display:none!important}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;z-index:3;top:8px;left:8px;right:8px;background:#fffE;padding:8px;display:flex;gap:6px;flex-wrap:wrap;border-radius:6px}button,select{font:inherit;padding:7px}output{position:fixed;bottom:8px;left:8px;background:#fffE;padding:8px;max-width:92vw;white-space:pre-wrap}i{position:fixed;top:50%;left:50%;width:4px;height:4px;background:#fff;border:1px solid #123;border-radius:50%}</style>
<canvas></canvas><nav><button id=hide>隐藏工具（` 恢复）</button><select id="floor"><option value="tiered">3层 阶梯教室</option><option value="classroom">1层 普通教室</option><option value="night">2层 停电的夜晚教室</option><option value="computer">4层 微机房</option><option value="tiered8">8层 阶梯教室</option></select><select id="layout"><option value="0">单桌</option><option value="1">双桌</option><option value="2">四桌</option><option value="3">混搭</option><option value="4">横向4×5</option><option value="5">纵向5×4</option></select><button data-view="front">前方向后看</button><button data-view="rear">后方向前看</button><button data-view="backboard">后墙</button><button data-view="graffitiSnack">辣条涂鸦</button><button data-view="graffitiHomework">作业涂鸦</button><button data-view="corridor">走廊</button><button data-view="tutorial">学生图示</button><button data-view="fixtures">墙开关</button><button data-view="doorframe">门框接缝</button><button data-view="office">办公室全景</button><button data-view="whiteboard">老师白板</button><button data-view="officecomputer">办公电脑</button><button data-view="teacherdesk">老师实际入椅</button><button data-view="studentkeyboard">学生实际打字</button><button data-view="laptop">讲台笔记本</button><button data-view="seat">阶梯座位</button><button id="computer30">微机房30人自动运行</button><button id="computer20">微机房20人自动运行</button><button id="walk">从电梯走上阶梯</button><button id="doors">开关后门</button><button id="interact">E 交互</button></nav><i></i><output>加载真实人物、桌椅与素材…</output>
<script type="module">
import{createClassroom}from'../dist/classroom.js?v=campus-76';
import{interactionIntent}from'../dist/interaction-intent54.js?v=campus-76';
import{ClassroomRound}from'../dist/classroom-rules.js?v=campus-76';
import{TeacherRound}from'../dist/teacher-rules.js?v=campus-76';
import{createSoloRound}from'../dist/solo-round.js?v=campus-76';
import{LIFT,moveInRoom,walkRoute,floorHeight,updateLayoutDoors}from'../dist/classroom-layout.js?v=campus-76';
const out=document.querySelector('output'),canvas=document.querySelector('canvas');let failure='';window.addEventListener('error',e=>failure=e.message);window.addEventListener('unhandledrejection',e=>failure=e.reason?.stack||String(e.reason));
const renderer=await createClassroom(canvas,{snapEntry:true});let round,view='front',route=[],rearClosed=false,simulateAI=false,last=performance.now();const keys=new Set();
function position(){if(view==='teacherdesk'){Object.assign(round.player,{x:4.8,z:11.7,seated:false,pitch:.50});round.sitOfficeChair('office-chair');route=[];return;}const seat=view==='studentkeyboard'?round.seats.find(s=>s.id===round.player.seatId):round.seats[10],p={front:{x:6.05,z:5.95,yaw:-2.76,pitch:.05},rear:{x:6.20,z:-8.95,yaw:-.31,pitch:.09},backboard:{x:.15,z:-5.1,yaw:Math.PI,pitch:-.11},graffitiSnack:{x:-4.9,z:4.8,yaw:-Math.PI/2,pitch:.45},graffitiHomework:{x:-4.9,z:1.6,yaw:-Math.PI/2,pitch:.45},corridor:{x:9.40,z:-8.50,yaw:0,pitch:0},tutorial:{x:8.25,z:.90,yaw:Math.PI/2,pitch:-.10},fixtures:{x:5.8,z:3.15,yaw:Math.PI/2,pitch:-.04},doorframe:{x:5.80,z:7.0,yaw:Math.PI/2,pitch:-.72},office:{x:9.18,z:10.45,yaw:-.65,pitch:.12},whiteboard:{x:8.05,z:17.7,yaw:0,pitch:0},officecomputer:{x:4.38,z:11.96,yaw:0,pitch:.28},laptop:{x:-.845,z:8.46,yaw:Math.PI,pitch:.51},studentkeyboard:{...seat,yaw:seat.yaw,pitch:.48},seat:{...seat,yaw:seat.yaw,pitch:.44}}[view];Object.assign(round.player,p,{seated:['seat','studentkeyboard'].includes(view),seatId:['seat','studentkeyboard'].includes(view)?seat.id:null,caught:false,captivity:'free',seatYaw:seat.yaw});if(view==='studentkeyboard'){round.startComputer();round.computerApp('snake');round.hold(true);}route=[];}
function reset(){const options={seed:Number(document.querySelector('#layout').value),map:document.querySelector('#floor').value,target:100000};round=simulateAI&&view!=='teacherdesk'?createSoloRound(options):new (view==='teacherdesk'?TeacherRound:ClassroomRound)(options);round.start();position();}
document.querySelector('#hide').onclick=()=>{document.querySelector('nav').hidden=true;out.hidden=true};window.addEventListener('keydown',e=>{if(e.code==='Backquote'){document.querySelector('nav').hidden=!document.querySelector('nav').hidden;out.hidden=document.querySelector('nav').hidden;}});
reset();for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;if(view==='studentkeyboard')document.querySelector('#floor').value='computer';reset()};document.querySelector('#floor').onchange=reset;document.querySelector('#layout').onchange=reset;
for(const [id,seed] of [['computer30',0],['computer20',4]])document.getElementById(id).onclick=()=>{simulateAI=true;view='front';document.querySelector('#floor').value='computer';document.querySelector('#layout').value=String(seed);reset();};
document.querySelector('#doors').onclick=()=>{rearClosed=!rearClosed;updateLayoutDoors(round.layout,{rearDoorClosed:rearClosed})};
document.querySelector('#walk').onclick=()=>{Object.assign(round.player,{x:LIFT.x,z:LIFT.z,seated:false,seatId:null,pitch:.07});view='walking';route=walkRoute(round.player,round.seats[0],.18,round.layout);};
function interact(){const intent=interactionIntent(round.snapshot(),renderer.getInteraction(),'E');if(intent&&typeof round[intent.method]==='function')return round[intent.method](...(intent.args||[]));}
document.querySelector('#interact').onclick=interact;window.addEventListener('keydown',e=>{if(e.target.matches('select'))return;keys.add(e.code);if(e.code==='KeyE'&&!e.repeat)interact();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(dragging){round.player.yaw-=e.movementX*.004;round.player.pitch=Math.max(-1.3,Math.min(1.3,round.player.pitch+e.movementY*.004));}};
window.map54={get round(){return round},renderer,go(next){view=next;if(view==='studentkeyboard')document.querySelector('#floor').value='computer';reset()},set(map,seed=0){document.querySelector('#floor').value=map;document.querySelector('#layout').value=String(seed);view='front';reset();}};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const p=round.player;
 if(!p.seated){let dx=0,dz=0;const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),side=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));if(f||side){route=[];dx=Math.sin(p.yaw)*f+Math.cos(p.yaw)*side;dz=Math.cos(p.yaw)*f-Math.sin(p.yaw)*side;}else if(route.length){const next=route[0],d=Math.hypot(next.x-p.x,next.z-p.z);if(d<.035)route.shift();else{dx=(next.x-p.x)/d;dz=(next.z-p.z)/d;p.yaw=Math.atan2(dx,dz);}}
  if(dx||dz){const n=Math.hypot(dx,dz),q=moveInRoom(p,dx/n*1.15*dt,dz/n*1.15*dt,.18,round.layout);p.x=q.x;p.z=q.z;}}
 if(simulateAI)round.step(dt);const s=round.snapshot();s.officeLocked=false;s.rearDoorClosed=rearClosed;s.sceneElapsed=now/1000;if(!simulateAI)s.elapsed=now/1000;s.paused=false;renderer.setGameplay(s);out.textContent=failure?'ERROR '+failure:JSON.stringify({view,simulateAI,students:s.students.length,typing:s.students.filter(p=>p.mood==='computer').length,computerActive:s.player.computerActive,computerApp:s.player.computer?.app,role:s.role,lighting:canvas.dataset.lighting,map:s.map,pattern:s.layoutPattern,feetHeight:floorHeight(p.x,p.z,s.map),position:{x:p.x.toFixed(2),z:p.z.toFixed(2)},route:route.length,artwork:canvas.dataset.campusArtwork,interaction:renderer.getInteraction(),render:canvas.dataset.sceneDebug})+'\n拖动画面转头；WASD真实碰撞行走；E拿取/放回。';requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
