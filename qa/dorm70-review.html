<!doctype html><html lang="zh"><meta charset="utf-8"><title>宿舍模型核对</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#10191c;font:14px system-ui}canvas{display:block}nav{position:absolute;left:12px;top:12px;display:flex;gap:8px;padding:8px;background:#fffde9e8;border-radius:5px}button{padding:6px 11px;border:1px solid #b6b5a4;background:#fffdf0;cursor:pointer}</style>
<canvas></canvas><nav><button data-view="aisle">过道</button><button data-view="bed">上下铺</button><button data-view="upper">上铺/柜</button><button id="cabinet">开/关柜</button><button id="light">明亮检查</button></nav><script type="module">
import * as T from '../dist/vendor/three.module.js';
import {OrbitControls} from '../dist/vendor/addons/controls/OrbitControls.js';
import {createDormRoom} from '../dist/dorm-room70.js';
import {hotpotHelpers} from './hotpot70-helpers.mjs';
const scene=new T.Scene();scene.background=new T.Color('#172125');const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.04,100),renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const h=hotpotHelpers(scene,{textureDraw:true}),room=createDormRoom(h),ambient=new T.HemisphereLight('#a6c4d6','#6a5137',.32);scene.add(ambient);const torch=new T.SpotLight('#fff2cd',21,18,Math.PI*.24,.6,1.2);torch.castShadow=true;torch.shadow.mapSize.set(1024,1024);torch.shadow.normalBias=.016;scene.add(torch,torch.target);const fill=new T.DirectionalLight('#e8f2ef',.24);fill.position.set(-6,4,5);scene.add(fill);
const wall=h.mat('#aaa98d'),trim=h.mat('#37675f'),glass=h.mat('#668c91',{roughness:.52});for(const x of[-6.7,7.25]){h.box(wall,[x,2.25,-1.8],[.1,4.5,16.4]);for(const z of[-8,-4,0,4]){h.box(trim,[x+(x<0?.062:-.062),2.35,z],[.06,2.3,2.8]);h.box(glass,[x+(x<0?.098:-.098),2.35,z],[.025,2.12,2.62]);h.box(trim,[x+(x<0?.12:-.12),2.35,z],[.03,.06,2.65]);}}h.box(wall,[.275,2.25,-10.05],[13.85,4.5,.1]);
const views={aisle:[[6.7,1.62,5.9],[-1,1.6,-4]],bed:[[2.3,1.64,2.5],[.05,1.4,.05]],upper:[[-.2,2.85,.1],[-1.65,2.24,.15]]};function setView(key){camera.position.set(...views[key][0]);controls.target.set(...views[key][1]);controls.update();}setView('aisle');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));let open=false,bright=false;document.querySelector('#cabinet').onclick=()=>open=!open;document.querySelector('#light').onclick=()=>{bright=!bright;ambient.intensity=bright?2.8:.32;fill.intensity=bright?2.2:.24;};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};let prev=0;renderer.setAnimationLoop(t=>{const dt=Math.min(.1,(t-prev)/1000);prev=t;room.update({dormCabinets:Object.fromEntries([...room.cabinets.keys()].map(id=>[id,open]))},dt);controls.update();torch.position.copy(camera.position);torch.target.position.copy(controls.target);renderer.render(scene,camera);});window.dormReview={scene,room,camera,renderer,setView};
</script></html>
