<!doctype html><html lang="zh"><meta charset="utf-8"><title>男女同学动作检查</title><style>body{margin:0;background:#dde6e7;font:15px system-ui}nav{position:fixed;top:16px;left:16px;display:flex;gap:10px;background:white;padding:12px;z-index:5}select,button{padding:8px}output{position:fixed;bottom:12px;left:16px;background:#ffffffd9;padding:8px}</style><nav><select id="model" aria-label="角色"><option value="boy">男同学</option><option value="girl">女同学</option><option value="glasses">眼镜同学</option><option value="hands">手掌</option></select><select id="pose" aria-label="动作"><option value="writing">写字</option><option value="resting">坐姿</option><option value="snack">零食</option><option value="phone">手机</option><option value="note">纸条</option><option value="thinking">转头</option><option value="idle">站立</option><option value="walking">走路</option><option value="carry">持物走路</option><option value="carried">被抓挣扎</option><option value="bound">绑住挣扎</option><option value="rescuing">解绳</option></select><select id="angle" aria-label="角度"><option value="0">正面</option><option value="1.57">侧面</option><option value="3.14">背面</option><option value=".75">斜侧</option></select><button id="pause">暂停</button><button id="step">前进 0.1 秒</button><button id="sample-a">抓取姿势 A</button><button id="sample-b">抓取姿势 B</button></nav><output id="report"></output><script type="module">
import * as T from '../dist/vendor/three.module.js';import{loadStudentAssets}from'../dist/student-assets.js?v=classroom-31';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.4));r.toneMapping=T.NeutralToneMapping;r.toneMappingExposure=1.12;document.body.append(r.domElement);
const s=new T.Scene();s.background=new T.Color('#dde6e7');s.add(new T.HemisphereLight('#fff5e9','#99a5ad',2));const l=new T.DirectionalLight('#fff4df',2.3);l.position.set(3,4,4);s.add(l);
const c=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,30),assets=await loadStudentAssets(),pivot=new T.Group();s.add(pivot);const actors={boy:assets.createStudent({variant:'boy'}),girl:assets.createStudent({variant:'girl'}),glasses:assets.createStudent({variant:'boy',glasses:true})};Object.values(actors).forEach(a=>pivot.add(a.group));
const furniture=new T.Group();pivot.add(furniture);function box(x,y,z,w,h,d,color){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color}));m.position.set(x,y,z);furniture.add(m)}box(0,.4125,0,.56,.055,.51,'#d69e51');box(0,.90,-.22,.56,.28,.035,'#d69e51');for(const x of[-.23,.23])for(const z of[-.19,.19])box(x,.22,z,.03,.44,.03,'#9babab');box(0,.86,.72,1.2,.04,.79,'#e5ab55');for(const x of[-.5,.5])for(const z of[.43,1])box(x,.42,z,.03,.84,.03,'#9babab');
const hands=new T.Group();s.add(hands);for(const side of[-1,1]){const h=assets.createHand(side,1);h.setCurl(0);h.group.position.set(side*.075,0,0);hands.add(h.group)}let t=0,last=0,paused=false;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停'};document.querySelector('#step').onclick=()=>t+=.1;
function sampleCapture(at){
 paused=true;document.querySelector('#pause').textContent='继续';document.querySelector('#pose').value='carried';
 for(const a of Object.values(actors)){a.setMood('carried');a.setMotion({seated:false,speed:0,restraint:'carried'});a.update(0);for(let i=1;i<=Math.ceil(at*60);i++)a.update(Math.min(at,i/60));}
 t=at;
}
document.querySelector('#sample-a').onclick=()=>sampleCapture(4.18);document.querySelector('#sample-b').onclick=()=>sampleCapture(5.18);
function frame(now){requestAnimationFrame(frame);if(!paused)t+=Math.min(.06,(now-last)/1000);last=now;const mode=document.querySelector('#model').value,angle=+document.querySelector('#angle').value,mood=document.querySelector('#pose').value,seated=!['idle','walking','carry','carried','bound','rescuing'].includes(mood);for(const [key,a]of Object.entries(actors)){a.group.visible=mode===key;if(!a.group.visible)continue;a.setMood(mood);a.setMotion({seated,speed:['walking','carry'].includes(mood)?.475:0,carrying:mood==='carry',restraint:['carried','bound','rescuing'].includes(mood)?mood:'free'});a.update(t);document.querySelector('#report').textContent=a.diagnostics().asset+' · '+mood;const pen=a.group.getObjectByName('held-writing-pencil');document.querySelector('#report').dataset.pen=JSON.stringify({visible:pen?.visible,weights:a.diagnostics().weights,world:pen?.getWorldPosition(new T.Vector3()).toArray(),hand:a.getHand('right').getWorldPosition(new T.Vector3()).toArray()});}hands.visible=mode==='hands';furniture.visible=mode!=='hands'&&seated;pivot.rotation.y=angle;hands.rotation.y=angle;if(mode!=='hands'){c.position.set(0,1.05,3.7);c.lookAt(0,.85,0)}else{c.position.set(0,.07,.50);c.lookAt(0,.03,0)}r.render(s,c)}requestAnimationFrame(frame);
</script></html>
