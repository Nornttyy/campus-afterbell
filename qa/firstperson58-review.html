<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>58 · 正式桌边手与书笔</title><link rel="stylesheet" href="./style.css?v=campus-78"><link rel="stylesheet" href="./reference-hud54.css?v=campus-78"><style>#hands58-tools{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:94vw;width:max-content;padding:8px;background:#fff9e9ec;font:13px system-ui}#hands58-tools button{padding:8px;white-space:nowrap}#hands58-tools output{flex-basis:100%;text-align:center}#hands58-load{position:fixed;inset:0;display:grid;place-items:center;background:#f1ead6;z-index:999}[hidden]{display:none!important}</style></head><body><div id="hands58-load">载入正式模型与教室…</div><nav id="hands58-tools"><button data-mode="idle">桌边空手</button><button data-mode="book">捧书两侧</button><button data-mode="twirl">平着转笔</button><button data-mode="write">写字</button><button data-mode="drawer">普通抽屉</button><button data-mode="lab-drawer">机房抽屉</button><button data-mode="teacher-office-drawer">老师办公室</button><button data-mode="office-drawer">办公室抽屉</button><button data-mode="held">抽屉持物</button><button data-mode="lab-idle">机房闲置</button><button data-mode="typing">机房打字</button><button id="hands58-pause">暂停 / 继续</button><button id="hands58-hide">隐藏工具（`恢复）</button><output id="hands58-state">准备中</output></nav><script type="module">
const base=document.baseURI,markup=await fetch(new URL('./index.html',base)).then(r=>r.text()),doc=new DOMParser().parseFromString(markup,'text/html');document.body.prepend(document.importNode(doc.querySelector('#game'),true));document.body.prepend(document.importNode(doc.querySelector('.icon-defs'),true));
const [{createClassroom},{createClassroomGame},{createSoloRound}]=await Promise.all(['./classroom.js?v=campus-78','./classroom-game.js?v=campus-78','./solo-round.js?v=campus-78'].map(p=>import(new URL(p,base))));
const {OFFICE_CHAIRS}=await import(new URL('./classroom-layout.js?v=campus-78',base));const $=id=>document.getElementById(id),canvas=$('classroom');canvas.hidden=false;canvas.requestPointerLock=()=>Promise.resolve();let round=createSoloRound({role:'student',seed:73,target:120}),scene=await createClassroom(canvas,{active:true,snapEntry:true}),game=createClassroomGame({scene,round,audio:{apply(){},start(){},effect(){},click(){}},onExit:()=>location.reload()});game.start();let mode='idle';
function select(next){mode=next;if((round.snapshot().role==='teacher')!==next.startsWith('teacher-')){round=createSoloRound({role:next.startsWith('teacher-')?'teacher':'student',seed:73,target:120});game.setRound(round);}round.pause(false);round.map=next.startsWith('lab')||next==='typing'?'computer':'classroom';round.reset(73);round.start();round._advanceTeacher=()=>{};for(const s of round.students)s._decisionAt=Infinity;const p=round.player;p.pitch=next.startsWith('teacher-')?1.15:next.includes('drawer')||next==='held'?.90:.55;round.setLook(p.seatYaw||0,p.pitch);round.setBookRaised(false);
 if(next.endsWith('office-drawer')){const c=OFFICE_CHAIRS[0];p.seated=false;p.x=c.x;p.z=c.z-.2;round.sitOfficeChair(c.id);round.openOfficeDrawer();}else if(next.includes('drawer')||next==='held'){round.toggleDrawer();if(next==='held')round.takeSlot(0);}
 if(next==='book')round.setBookRaised(true);if(['twirl','write'].includes(next)){round.takePen();if(next==='write')round.togglePenMode();}if(next==='typing')round.startComputer();scene.setGameplay(round.snapshot());
}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>select(b.dataset.mode);$('hands58-pause').onclick=()=>round.pause(!round.paused);$('hands58-hide').onclick=()=>$('hands58-tools').hidden=true;addEventListener('keydown',e=>{if(e.code==='Backquote')$('hands58-tools').hidden=!$('hands58-tools').hidden;});
const timer=setInterval(()=>{const s=round.snapshot();$('hands58-state').textContent=`${mode} · ${s.map} · 坐姿 ${s.player.seated} · 书 ${s.books.find(b=>b.id===s.player.seatId)?.amount?.toFixed(2)} · 笔 ${s.player.penWriting?'写字':s.player.penTwirling?'转笔':'未拿'} · 电脑 ${s.player.computerActive} · 手持 ${s.drawer.drawnSlot===null?'无':s.selected} · 可归还 ${s.drawer.canReturn} · 进度 ${s.actionProgress.toFixed(2)} · 捣蛋 ${s.score??s.points??0} · x ${s.player.x.toFixed(2)} z ${s.player.z.toFixed(2)}`;},100);addEventListener('pagehide',()=>{clearInterval(timer);game.dispose();scene.dispose();},{once:true});
select(new URLSearchParams(location.search).get('mode')||'idle');document.body.classList.add('scene-ready');$('hands58-load').hidden=true;window.hands58QA={round,scene,game,select};window.qaReady=true;
</script></body></html>
