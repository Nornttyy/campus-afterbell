<!doctype html><html lang="zh"><meta charset="utf-8"><title>校园 50 地图实测</title><style>html,body{margin:0;height:100%;background:#e8eeee;font:14px sans-serif}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;z-index:3;top:8px;left:8px;background:#fffE;padding:8px;border-radius:6px;display:flex;gap:6px;max-width:95vw;flex-wrap:wrap}button,select{font:inherit;padding:7px}output{position:fixed;bottom:10px;left:10px;background:#fffE;padding:8px;max-width:92vw}i{position:fixed;top:50%;left:50%;width:4px;height:4px;background:#fff;border:1px solid #123;border-radius:50%}</style><canvas></canvas><nav><select id="layout"><option value="0">单桌</option><option value="1">双桌</option><option value="2">四桌</option><option value="3">混搭</option></select><select id="floor"><option>classroom</option><option>night</option><option>computer</option><option>tiered</option><option>computer7</option><option>tiered8</option></select><button data-view="class">教室</button><button data-view="corridor">走廊</button><button data-view="office">办公室</button><button data-view="lift">八层电梯</button><button data-view="seat">坐下</button><button id="doors">切换门</button><button id="drawer">办公室抽屉</button><button id="interact">E 交互</button></nav><i></i><output>加载人物与材质…</output><script type="module">
import{createClassroom}from'../dist/classroom.js?v=campus-76';import{ClassroomRound}from'../dist/classroom-rules.js?v=campus-76';import{CAMPUS_MAPS,OFFICE_CHAIR}from'../dist/classroom-layout.js?v=campus-76';
const out=document.querySelector('output');window.addEventListener('error',e=>out.textContent='ERROR '+e.message);window.addEventListener('unhandledrejection',e=>out.textContent='ERROR '+(e.reason?.stack||e.reason));
const canvas=document.querySelector('canvas'),renderer=await createClassroom(canvas,{snapEntry:true}),round=new ClassroomRound({seed:0,target:100000});let view='class',closed=false,officeOpen=false;round.start();let last=performance.now();
const position=()=>{const s=round.seats[9],p={class:{x:6.5,z:-8.8,yaw:-.44,pitch:.18},corridor:{x:9.3,z:-9.4,yaw:0,pitch:.1},office:{x:8.9,z:10,yaw:-.75,pitch:.12},lift:{x:9.7,z:-11.2,yaw:-Math.PI/2,pitch:.03},seat:{...s,yaw:s.yaw,pitch:.65}}[view];Object.assign(round.player,p,{seated:view==='seat',seatId:view==='seat'?s.id:null,caught:false});};position();
document.querySelector('#layout').onchange=e=>{round.reset(Number(e.target.value));round.start();position();};document.querySelector('#floor').onchange=e=>round.map=e.target.value;for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;position();};document.querySelector('#doors').onclick=()=>closed=!closed;document.querySelector('#drawer').onclick=()=>officeOpen=!officeOpen;document.querySelector('#interact').onclick=()=>{const t=renderer.getInteraction();if(t?.kind==='desk')round.toggleDrawer();if(t?.kind==='book')round.toggleBook();if(t?.kind==='item')round.takeSlot(t.slot);if(t?.kind==='pen')round.takePen();};
let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(dragging){round.player.yaw-=e.movementX*.004;round.player.pitch=Math.max(-1.4,Math.min(1.4,round.player.pitch+e.movementY*.004));}};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const s=round.snapshot();s.officeLocked=closed;s.rearDoorClosed=closed;s.officeDeskOpen=officeOpen;s.sceneElapsed=now/1000;s.elapsed=now/1000;s.paused=false;renderer.setGameplay(s);out.textContent=JSON.stringify({view,pattern:s.layoutPattern,floor:s.map,interaction:renderer.getInteraction(),frame:canvas.dataset.frameMs,students:JSON.parse(canvas.dataset.sceneDebug||'{}').visibleStudents});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
