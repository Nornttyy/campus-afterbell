<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色眩晕与遮脸检查</title><style>body{margin:0;font:14px system-ui;background:#e9e3d7}nav{position:absolute;z-index:10;top:12px;left:12px;display:flex;gap:8px}button,select{font:inherit;padding:9px}output{position:absolute;bottom:14px;left:14px;background:#fffd;padding:10px}canvas{display:block}</style><nav><select id="model" aria-label="角色"><option value="boy">男同学</option><option value="girl">紫发同学</option><option value="ponytail">马尾同学</option><option value="glasses">眼镜同学</option><option value="teacher">老师</option></select><select id="pose" aria-label="效果"><option value="stun">眩晕</option><option value="ink">墨水</option><option value="both">眩晕与墨水</option><option value="none">正常</option></select><select id="angle" aria-label="方向"><option value="0">正面</option><option value=".65">斜侧</option><option value="1.5708">侧面</option></select><button id="pause">暂停</button><button id="flash">闪光</button><button id="gum">泡泡遮脸</button></nav><output>加载中</output><script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadStudentAssets} from '../dist/student-assets.js?v=campus-75';
import {loadTeacherModel} from '../dist/imported-actors.js?v=campus-75';
import {createItemEffects50} from '../dist/item-effects50.js?v=campus-75';
import {createVisionEffects} from '../dist/vision-effects.js?v=campus-75';
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#e9e3d7');const cam=new T.PerspectiveCamera(30,innerWidth/innerHeight,.02,30);cam.position.set(0,1.2,3.4);cam.lookAt(0,.85,0);scene.add(new T.HemisphereLight(0xffffff,0xa6ada2,3));const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshLambertMaterial({color:0xc4cfc1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const assets=await loadStudentAssets(),teacher=await loadTeacherModel();let actor,variant='',time=0,last=performance.now(),paused=false,flash=0,gum=0;const model=document.querySelector('#model'),pose=document.querySelector('#pose'),angle=document.querySelector('#angle'),output=document.querySelector('output');
const fx=createItemEffects50(scene,{camera:cam,getActor:()=>actor}),vision=createVisionEffects(document.body);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};document.querySelector('#flash').onclick=()=>flash=4;document.querySelector('#gum').onclick=()=>gum=4;
function frame(now){requestAnimationFrame(frame);let dt=paused?0:Math.min(.05,(now-last)/1000);last=now;time+=dt;flash=Math.max(0,flash-dt);gum=Math.max(0,gum-dt);if(variant!==model.value){if(actor)scene.remove(actor.group);variant=model.value;actor=variant==='teacher'?teacher:assets.createStudent({variant,seated:false,seed:1});scene.add(actor.group);}const stunned=['stun','both'].includes(pose.value),ink=['ink','both'].includes(pose.value)?4:0;actor.group.rotation.y=Number(angle.value);if(variant==='teacher')actor.update(time,{phase:stunned?'stunned':'watching',inkLeft:ink});else{actor.setMood('resting');actor.setMotion({seated:false,restraint:stunned?'stunned':'free',inkLeft:ink});actor.update(time);}const id=variant==='teacher'?-1:1,p={id,x:0,z:0,yaw:Number(angle.value),stunLeft:stunned?4:0,inkLeft:ink};fx.update({elapsed:time,player:{id:9},students:id===1?[p]:[],teacher:id===-1?p:{}});vision.update({player:{flashLeft:flash,flashDuration:4,bubbleLeft:gum,bubbleKind:'pink'}});r.render(scene,cam);output.textContent=variant+' '+pose.value+' '+JSON.stringify(actor.diagnostics().face);}
requestAnimationFrame(frame);
</script></html>
