// Read the actual loaded GLB's Walk duration, rather than assuming a fixed cycle.
function getWalkInfo(id){
 const file=id==='teacher'?'teacher-v2':STUDENT_ASSETS[id].file;
 if(!clipInfoCache.has(id))clipInfoCache.set(id,(async()=>{
  const response=await fetch(new URL(`../dist/assets/models/${file}.glb?v=arms-49b`,import.meta.url));if(!response.ok)throw new Error('动作元数据读取失败');

function reset(){time=0;travelDistance=actualSpeed=0;pivot.position.set(0,0,0);last=performance.now();frameTimes=[];actor.update(0);}

let activeRecording=null,recordingUrl=null;

 const run={recorder,stream,chunks:[],wasPaused:paused,started:performance.now(),role:currentModel,pose:ui.pose.value,speed:ui.speed.value,revision:clipInfo?.motionRevision??'unknown',controls:[...document.querySelectorAll('nav button,nav select,nav input')].map(element=>[element,element.disabled]),error:''};activeRecording=run;
 run.controls.forEach(([element])=>element.disabled=true);paused=false;last=performance.now();ui.pause.textContent='暂停';ui.record.textContent='录制中 3.0s';

  clearTimeout(run.stopTimer);clearInterval(run.labelTimer);stream.getTracks().forEach(track=>track.stop());run.controls.forEach(([element,disabled])=>element.disabled=disabled);paused=run.wasPaused;last=performance.now();ui.pause.textContent=paused?'播放':'暂停';ui.record.textContent='录制3秒';activeRecording=null;
  if(run.error||!run.chunks.length){ui['recording-notice'].textContent=run.error||'没有录到有效画面';return;}
  const type=recorder.mimeType||recordingType,blob=new Blob(run.chunks,{type}),ext=type.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(blob),file=`${run.role}-${run.pose}-${run.speed}mps-motion${run.revision}.${ext}`;
  ui['recorded-video'].src=url;ui['recorded-video'].load();if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=url;
  ui['download-recording'].href=url;ui['download-recording'].download=file;ui['download-recording'].textContent='下载 '+ext.toUpperCase();ui['recording-info'].textContent=`${run.role} · ${run.pose} · ${run.speed} m/s · 动作版本 ${run.revision} · ${(blob.size/1048576).toFixed(2)} MB · 仅画布，无声音`;
  ui['open-recording'].hidden=false;ui['recording-preview'].hidden=false;

 try{recorder.start(100);run.stopTimer=setTimeout(()=>stopRecording(),3000);run.labelTimer=setInterval(()=>{ui.record.textContent='录制中 '+Math.max(0,3-(performance.now()-run.started)/1000).toFixed(1)+'s';},100);}catch(error){run.error=error.message;recorder.onstop();}
}
ui.record.onclick=recordThreeSeconds;ui['close-recording'].onclick=()=>{ui['recorded-video'].pause();ui['recording-preview'].hidden=true;};ui['open-recording'].onclick=()=>{ui['recording-preview'].hidden=false;};
