<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>无绳绑柱正式场景检查</title><link rel="stylesheet" href="./style.css?v=campus-78"><link rel="stylesheet" href="./reference-hud54.css?v=campus-78"><style>#bound-qa{position:fixed;z-index:100;left:50%;top:8px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:94vw;width:max-content;gap:6px;padding:8px;background:#fff9e9e8;font:13px system-ui}#bound-qa button,#bound-qa select{padding:7px 10px;white-space:nowrap;font:inherit}#bound-qa output{flex-basis:100%;text-align:center}#bound-load{position:fixed;inset:0;display:grid;place-items:center;background:#fff9e9;z-index:999}#bound-load[hidden],#bound-qa[hidden]{display:none}</style></head><body><div id="bound-load">加载正式场景与四套原角色…</div><nav id="bound-qa"><select id="bound-variant"><option value="boy">男同学</option><option value="girl">女同学</option><option value="glasses">眼镜同学</option><option value="ponytail">棕色长发同学</option></select><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面（临时隐藏遮挡）</button><button id="bound-close">靠近解救</button><button id="bound-again">重新绑柱</button><button id="bound-help">按住解救（正式 E 规则）</button><button id="bound-pause">暂停 / 继续</button><button id="bound-hide">隐藏工具</button><output id="bound-state">加载中</output></nav><script type="module">
import * as T from './vendor/three.module.js';
// Three installs render as an instance property, so a prototype method alone
// cannot intercept the real viewmodel pass. This QA-only setter wraps exactly
// the created renderer instance and never changes production scene behavior.
let qaView='front';const renderMethods=new WeakMap(),inspection={handsSkipped:0,variant:null,wristZ:[],blockedMeshes:0};
Object.defineProperty(T.WebGLRenderer.prototype,'render',{configurable:true,get(){return renderMethods.get(this);},set(fn){renderMethods.set(this,function(s,c){
 if(s.getObjectByName('first-person-school-hands')){inspection.handsSkipped++;return;}
 const record=s.getObjectByName('student-seat-2'),actor=record?.children.find(o=>o.visible&&o.name.startsWith('student-'));
 const hidden=[];
 if(actor){s.updateMatrixWorld(true);inspection.variant=actor.userData.character;const bones={};actor.traverse(o=>{if(o.isBone)bones[o.name.replace(/^mixamorig[:_]?/,'')]=o;});inspection.wristZ=['Left','Right'].map(side=>actor.worldToLocal(bones[side+'Hand'].getWorldPosition(new T.Vector3())).z);
  if(qaView==='back'){
   const blockers=[];s.traverse(o=>{if(!o.isMesh||o.isSkinnedMesh||!o.visible)return;for(let p=o;p;p=p.parent)if(p.name.startsWith('student-seat-')||p.name==='capture-posts')return;blockers.push(o);});
   const origin=c.getWorldPosition(new T.Vector3());for(const name of ['Head','Hips','LeftHand','RightHand','LeftFoot','RightFoot']){const goal=bones[name]?.getWorldPosition(new T.Vector3());if(!goal)continue;const delta=goal.sub(origin),ray=new T.Raycaster(origin,delta.clone().normalize(),0,Math.max(0,delta.length()-.12));for(const hit of ray.intersectObjects(blockers,false))if(hit.object.visible){hit.object.visible=false;hidden.push(hit.object);}}
  }
  inspection.blockedMeshes=hidden.length;
 }
 try{return fn.call(this,s,c);}finally{for(const o of hidden)o.visible=true;}
 });}});
const base=document.baseURI,markup=await fetch(new URL('./index.html',base)).then(r=>r.text()),doc=new DOMParser().parseFromString(markup,'text/html');document.body.prepend(document.importNode(doc.querySelector('#game'),true));document.body.prepend(document.importNode(doc.querySelector('.icon-defs'),true));
const [{createClassroom},{createClassroomGame},{createSoloRound},{DETENTION}]=await Promise.all(['./classroom.js?v=campus-78','./classroom-game.js?v=campus-78','./solo-round.js?v=campus-78','./classroom-layout.js?v=campus-78'].map(p=>import(new URL(p,base))));
const $=id=>document.getElementById(id),canvas=$('classroom');canvas.hidden=false;canvas.requestPointerLock=()=>Promise.resolve();const round=createSoloRound({role:'student',seed:73,target:120}),scene=await createClassroom(canvas,{active:true,snapEntry:true}),game=createClassroomGame({scene,round,audio:{apply(){},start(){},effect(){},click(){}},onExit:()=>location.reload()});game.start();round.reset(73);round.start();round._advanceTeacher=()=>{};for(const s of round.students)s._decisionAt=Infinity;
const pupil=round.students[2],post=DETENTION[2];round._team.add(pupil.id);let view='front';
// Local AI snapshots intentionally have no cosmetic field; inject the QA
// choice in the actual render snapshot instead of only changing the label.
const realSnapshot=round.snapshot.bind(round);round.snapshot=()=>{const state=realSnapshot();state.students.find(s=>s.id===pupil.id).character=$('bound-variant').value;return state;};
function look(angle){view=qaView=angle;const position=angle==='back'?{x:post.x,z:post.z+2.5}:angle==='side'?{x:post.x+2.6,z:post.z-.3}:angle==='close'?{x:post.x,z:post.z-1.45}:{x:post.x,z:post.z-2.9};const yaw=Math.atan2(pupil.x-position.x,pupil.z-position.z);Object.assign(round.player,{...position,seated:false,seatId:null,yaw,pitch:angle==='close'?.15:.25});round.setMovement(0,0);round.setLook(yaw,round.player.pitch);}
function bind(){round.pause(false);round.setRescue(null);if(pupil.captivity!=='free')round._release(pupil);round.teacher.x=pupil.x;round.teacher.z=pupil.z+.9;round._stun(pupil);round._grab(pupil);round.teacher.x=post.x;round.teacher.z=post.z-1.1;if(!round._bind(post.id))throw Error('real bind failed');Object.assign(round.teacher,{x:8.8,z:12,yaw:0});round.teacher.carriedId=null;pupil.character=$('bound-variant').value;look(view);}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>look(b.dataset.view);$('bound-variant').onchange=()=>pupil.character=$('bound-variant').value;$('bound-again').onclick=bind;$('bound-pause').onclick=()=>round.pause(!round.paused);$('bound-hide').onclick=()=>$('bound-qa').hidden=true;
$('bound-close').onclick=()=>look('close');
$('bound-help').onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);round.pause(false);look('close');round.setRescue(pupil.id);};for(const name of ['pointerup','pointercancel','lostpointercapture'])$('bound-help').addEventListener(name,()=>round.setRescue(null));
const timer=setInterval(()=>{$('bound-state').textContent=`${inspection.variant||pupil.character} · ${pupil.captivity} · ${view} · 手腕Z ${inspection.wristZ.map(v=>v.toFixed(2)).join('/')} · 手部已隐藏${inspection.handsSkipped>0} · 解救 ${Math.round(round.snapshot().rescue.progress*100)}% · 无绳子`;canvas.dataset.boundState=JSON.stringify({captivity:pupil.captivity,postId:pupil.postId,character:pupil.character,inspection,rescue:round.snapshot().rescue});},100);
window.addEventListener('keydown',e=>{if(e.code==='Backquote')$('bound-qa').hidden=!$('bound-qa').hidden;});window.addEventListener('pagehide',()=>{clearInterval(timer);game.dispose();scene.dispose();},{once:true});bind();document.body.classList.add('scene-ready');$('bound-load').hidden=true;window.bound57QA={round,scene,game,bind,look,pupil,inspection};window.qaReady=true;
</script></body></html>
