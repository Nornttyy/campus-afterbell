<!doctype html><html lang="zh"><meta charset="utf-8"><title>新地图玩法检查 83</title><style>body{margin:0;font:14px sans-serif;background:#dce5df}canvas{display:block;width:100vw;height:calc(100vh - 120px)}nav{display:flex;gap:6px;padding:8px;flex-wrap:wrap}button,select{font:inherit;padding:7px}output{display:block;white-space:pre-wrap;font:12px monospace;padding:6px}#cross{position:fixed;left:50%;top:50%;background:white;border:1px solid #555;border-radius:50%;width:4px;height:4px}</style>
<nav><label>地图<select id="map"><option value="playground">操场</option><option value="hotpot">火锅</option><option value="toilet">厕所</option><option value="dorm">宿舍</option></select></label><label>角色<select id="role"><option value="student">学生</option><option value="teacher">老师</option></select></label><button id="reset">重新开始</button><button id="ready">交互准备</button><button id="seat">坐下 / 下床</button><button id="drawer">打开 / 关闭储物</button><button id="take">取食物</button><button id="eat">低头持续使用</button><button id="return">放回</button><button id="book">拿起 / 放下书</button><button id="use">E 交互</button><button id="cancel">Q 返回</button><button id="walk">步行 1 秒</button><button id="run">奔跑 1 秒</button><button id="look">观察人机</button></nav><canvas tabindex="0"></canvas><span id="cross"></span><output>加载中</output>
<script type="module">
import{createClassroom}from'../dist/classroom.js?v=campus-83';import{createSoloRound}from'../dist/solo-round.js?v=campus-83';import{interactionIntent}from'../dist/interaction-intent54.js?v=campus-83';import{PLAYGROUND_LAYOUT}from'../dist/playground-layout70.js?v=campus-83';import{vendingApproach}from'../dist/new-map-ai83.js?v=campus-83';import{DORM_ROOMS,dormRoomPoint}from'../dist/dorm-layout70.js?v=campus-83';
const canvas=document.querySelector('canvas'),out=document.querySelector('output'),scene=await createClassroom(canvas,{snapEntry:true});let round,last=performance.now(),message='',testMove=null,error='',observe=false;
addEventListener('error',e=>error=e.message);addEventListener('unhandledrejection',e=>error=String(e.reason));
function reset(){round=createSoloRound({map:document.querySelector('#map').value,role:document.querySelector('#role').value,target:10000});round.start();testMove=null;observe=false;message='';if(round.player.id===-1){Object.assign(round.player,{x:9.8,z:-12,yaw:0,pitch:0});}}
function ready(){observe=false;const p=round.player;if(round.map==='playground'){const v=PLAYGROUND_LAYOUT.vending[0];Object.assign(p,{...vendingApproach(v),seated:false,seatId:null,yaw:Math.atan2(v.x-vendingApproach(v).x,v.z-vendingApproach(v).z),pitch:.1});}else if(round.map==='dorm'){const b=round.seats[p.bedId??p.seatId??1];p.yaw=Math.atan2(b.cabinetX-p.x,b.cabinetZ-p.z);p.pitch=.05;}else{const seat=round.seats[p.seatId??2];p.yaw=seat.yaw||0;p.pitch=.52;}message='准备';}
const act=(id,fn)=>document.getElementById(id).onclick=()=>{try{message=id+': '+JSON.stringify(fn());}catch(e){error=e.stack;}};
document.querySelector('#map').onchange=reset;document.querySelector('#role').onchange=reset;act('reset',reset);act('ready',ready);act('seat',()=>round.interact());act('drawer',()=>round.toggleDrawer());act('take',()=>round.map==='playground'?round.takePlaygroundFood('snack'):round.takeSlot(0));act('eat',()=>{round.setLook(round.player.seated?round.player.seatYaw:round.player.yaw,.72);round.hold(true);return true;});act('return',()=>round.returnItem());act('book',()=>round.toggleBook());
function key(k){const a=interactionIntent(round.snapshot(),scene.getInteraction(),k);return a?round[a.method]?.(...(a.args||[])):false;}
act('use',()=>key('E'));act('cancel',()=>key('Q'));
for(const [id,sprint]of[['walk',false],['run',true]])act(id,()=>{Object.assign(round.player,{x:0,z:-20,yaw:0,seated:false,seatId:null});round.setSprint(sprint);round.setMovement(0,1);testMove={left:1,start:round.player.z,sprint};return sprint;});
act('look',()=>{observe=true;if(round.map==='dorm')Object.assign(round.player,{...dormRoomPoint(1,0,2.3),seated:false,bedId:null,seatId:null,yaw:0,pitch:.15});else if(round.map==='playground'){const v=PLAYGROUND_LAYOUT.vending[0];Object.assign(round.player,{x:v.x+Math.sin(v.yaw)*8,z:v.z+4,seated:false,yaw:Math.atan2(v.x-round.player.x,v.z-round.player.z),pitch:.02});}else Object.assign(round.player,{x:.2,z:5.7,seated:false,seatId:null,yaw:Math.PI,pitch:.1});return true;});
const keys=new Set;addEventListener('keydown',e=>{if(e.target.matches('select'))return;keys.add(e.code);if(e.code==='KeyE'&&!e.repeat)key('E');if(e.code==='KeyQ'&&!e.repeat)key('Q');});addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='KeyE')round.releaseMapActivity();});addEventListener('blur',()=>{keys.clear();round.setSprint(false);round.setMovement(0,0);});let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(dragging)round.setLook(round.player.yaw-e.movementX*.004,Math.max(-1.3,Math.min(1.3,round.player.pitch+e.movementY*.004)))};
reset();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 if(testMove){const step=Math.min(testMove.left,dt);round.step(step);testMove.left-=step;if(testMove.left<=.00001){message=(testMove.sprint?'奔跑':'步行')+' 1 秒: '+(round.player.z-testMove.start).toFixed(3)+' 米';testMove=null;round.setSprint(false);round.setMovement(0,0);}}
 else{const p=round.player,f=+keys.has('KeyW')-keys.has('KeyS'),a=+keys.has('KeyD')-keys.has('KeyA');round.setMovement(Math.sin(p.yaw)*f-Math.cos(p.yaw)*a,Math.cos(p.yaw)*f+Math.sin(p.yaw)*a);if(p.id===-1)round.setSprint(keys.has('ShiftLeft')||keys.has('ShiftRight'));else round.setCrouch(keys.has('ShiftLeft')||keys.has('ShiftRight'));round.step(dt);}
 const state=round.snapshot();scene.setGameplay(state);const p=state.player;out.textContent=error?'ERROR '+error:message+'\n'+JSON.stringify({map:state.map,role:state.role,score:state.score,elapsed:Math.round(state.elapsed),player:{x:p.x,z:p.z,seated:p.seated,bed:p.bedId,holding:p.holding,sprinting:p.sprinting},drawer:state.drawer,interaction:scene.getInteraction(),teacher:{intent:state.teacher.intent,x:state.teacher.x,z:state.teacher.z,pitch:state.teacher.pitch},inspected:Object.keys(round._inspectionVisits),exercising:state.students.filter(a=>a.mapActivity).length});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
