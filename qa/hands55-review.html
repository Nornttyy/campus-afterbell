<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 · 真实骨骼与接触检视</title>
<style>body{margin:0;font:14px system-ui;color:#273a3c;background:#dce6e6}canvas{display:block;width:100vw;height:100vh}nav,footer{position:fixed;left:12px;right:12px;background:#fffffff0;padding:10px;border:1px solid #b8c8ca;border-radius:7px}[hidden]{display:none!important}nav{top:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}footer{bottom:12px;font-size:12px}button,select{padding:8px;font:inherit;background:white;border:1px solid #9dafb1;border-radius:4px}button[aria-pressed=true]{background:#346d7a;color:white}input{width:80px}output{font-variant-numeric:tabular-nums}#error{color:#b33}</style>
<canvas></canvas><nav><button id="tools">隐藏工具（` 恢复）</button><select id="role"><option value="student">学生原手</option><option value="teacher">老师原手</option></select><select id="activity"><option value="carry">持物</option><option value="empty">空手落桌</option><option value="keyboard">电脑打字</option><option value="crawl">爬行</option></select><select id="item"><option value="snack">辣条/零食</option><option value="drink">饮料</option><option value="burger">汉堡</option><option value="banana">香蕉</option><option value="garlic">大蒜</option><option value="gum">泡泡糖</option><option value="lunch">午餐</option><option value="pen">笔</option><option value="phone">手机</option><option value="smoke">烟雾罐</option><option value="flash">闪光</option><option value="ink">墨水</option><option value="bananaPeel">香蕉皮</option></select><button id="carry">放回</button><button id="replay">原速播放 3 秒</button><button id="mode">转笔 → 写字</button><button id="pause">暂停</button><button id="step">前进 1 帧</button><button id="stand">站立</button><button id="walk">行走</button><button data-angle="0">玩家视角</button><button data-angle="-.85">左侧检视</button><button data-angle=".85">右侧检视</button><label>俯仰 <input id="pitch" type="range" min="-1.2" max="1.2" value=".08" step=".01"></label><label>转头 <input id="yaw" type="range" min="-1.3" max="1.3" value="0" step=".01"></label><output id="state">加载真实 GLB…</output></nav>
<footer><button data-phase=".35">翻掌 0.35 秒</button> <button data-phase="1.5">食用 1.5 秒</button> <button data-phase="2.7">回位 2.7 秒</button> 真实学生 hand-v3 / teacher-hand-v1 蒙皮与正式物品；低头才食用；固定原尺寸、原贴图。播放器按真实秒推进；相位按钮以 60Hz 推进后暂停。侧视仅用于接触检视。<span id="error"></span></footer>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadStudentAssets} from '../dist/student-assets.js';
import {createDeskHands,loadPropAssets} from '../dist/game-actors.js';
import {CLASSROOM_PROP_SOURCES} from '../dist/prop-assets.js?v=campus-65';
import {loadDeskModel} from '../dist/imported-actors.js';
import {createFirstPersonView,sampleFirstPersonMotion,firstPersonEyeHeight} from '../dist/first-person-view.js';
const ui=Object.fromEntries(['role','activity','item','carry','replay','mode','pause','step','stand','walk','pitch','yaw','state','error'].map(k=>[k,document.getElementById(k)]));
const query=new URLSearchParams(location.search),requestedItem=query.get('item');if(query.get('role')==='teacher')ui.role.value='teacher';if([...ui.activity.options].some(o=>o.value===query.get('activity')))ui.activity.value=query.get('activity');if([...ui.item.options].some(o=>o.value===requestedItem))ui.item.value=requestedItem;
document.getElementById('tools').onclick=()=>{document.querySelector('nav').hidden=true;document.querySelector('footer').hidden=true;};addEventListener('keydown',event=>{if(event.key==='`'){const show=document.querySelector('nav').hidden;document.querySelector('nav').hidden=!show;document.querySelector('footer').hidden=!show;}});
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color('#dde6e7');scene.add(new T.HemisphereLight('#ffffff','#849496',3));const sun=new T.DirectionalLight('#fff6e6',2);sun.position.set(-3,6,2);scene.add(sun);
const camera=new T.PerspectiveCamera(62,1,.04,40);scene.add(camera);
try{
const [assets,desk]=await Promise.all([loadStudentAssets(),loadDeskModel(),loadPropAssets(CLASSROOM_PROP_SOURCES)]);
const body=desk.body.clone(true),drawer=desk.drawer.clone(true);body.position.set(0,0,.76);drawer.position.set(0,0,.52);scene.add(body,drawer);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#c9d2c8'}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new T.GridHelper(30,30);grid.position.y=.002;scene.add(grid);
const studentHands=createDeskHands({createHand:assets.createHand}),teacherHands=createDeskHands({createHand:assets.createTeacherHand}),view=createFirstPersonView(renderer,camera,[studentHands.group,teacherHands.group]);let hands=studentHands;
const keyboard=new T.Group();scene.add(keyboard);keyboard.visible=false;for(let r=0;r<3;r++)for(let k=0;k<11;k++){const key=new T.Mesh(new T.BoxGeometry(.035,.008,.029),new T.MeshBasicMaterial({color:'#d5d9df'}));key.position.set(-.32+k*.046,.897,.78-.245+r*.045);keyboard.add(key);}
let time=0,last=0,paused=false,carrying=true,seated=true,walking=false,writing=false,play=-1,angle=0,motion=null;
const player={x:0,z:0,yaw:0,pitch:.08,seated:true,seatYaw:0};
function render(dt=0){
 time+=dt;hands=ui.role.value==='teacher'?teacherHands:studentHands;studentHands.group.visible=hands===studentHands;teacherHands.group.visible=hands===teacherHands;const activity=ui.activity.value,isKeyboard=activity==='keyboard',isCrawl=activity==='crawl';if(isCrawl){seated=false;walking=true;}player.crouched=isCrawl;keyboard.visible=isKeyboard;player.seated=seated;player.yaw=Number(ui.yaw.value);player.pitch=Number(ui.pitch.value);if(walking&&!seated)player.z+=dt*1.5;
 motion=sampleFirstPersonMotion(motion,player,time);if(play>=0&&player.pitch>=.38)play=Math.min(3,play+dt);
 const using=play>=0&&play<3,progress=play>=0?play/3:0;
 hands.update(time,{action:ui.item.value,carrying:carrying&&activity==='carry',holding:using,eating:using&&player.pitch>=.38,progress,seated,penWriting:writing,computer:isKeyboard,typing:isKeyboard,freeLook:true,movement:motion.amount,walkPhase:motion.phase,crawlBlend:motion.crawlBlend});
 const eye=new T.Vector3(player.x,firstPersonEyeHeight(player,ui.role.value),player.z);view.align(player,motion,eye);
 camera.position.copy(eye);camera.rotation.set(-player.pitch,player.yaw+Math.PI,0,'YXZ');
 if(angle){const target=eye.clone().add(new T.Vector3(0,-.22,.57));camera.position.copy(target).add(new T.Vector3(Math.sin(angle)*.85,.13,-Math.cos(angle)*.85));camera.lookAt(target);}
 camera.updateMatrixWorld(true);renderer.render(scene,camera);view.render();
 const d=hands.getDebug();ui.state.textContent=`${time.toFixed(2)}s · ${play<0?'待播放':play.toFixed(2)+' / 3.00s'} · ${ui.item.value==='pen'?(writing?'写字':'转笔'):using?'食用中':'握持'} · 掌向 ${d.articulation[0].palm.map(x=>x.toFixed(2)).join(', ')}`;
 ui.carry.textContent=carrying?'放回':'拿起';ui.pause.textContent=paused?'继续':'暂停';ui.stand.textContent=seated?'站立':'坐下';ui.walk.setAttribute('aria-pressed',String(walking));ui.mode.hidden=ui.item.value!=='pen';ui.mode.textContent=writing?'写字 → 转笔':'转笔 → 写字';canvas.dataset.state=JSON.stringify({...d,time,play,writing,seated,walking});
}
ui.replay.onclick=()=>{carrying=true;paused=false;play=0;ui.pitch.value='.40';render();};ui.carry.onclick=()=>{carrying=!carrying;play=-1;render();};ui.role.onchange=()=>{play=-1;resize();};ui.activity.onchange=()=>{play=-1;carrying=ui.activity.value==='carry';seated=ui.activity.value!=='crawl';player.z=0;motion=null;render();};ui.mode.onclick=()=>{writing=!writing;render();};ui.pause.onclick=()=>{paused=!paused;render();};ui.step.onclick=()=>{paused=true;render(1/60);};ui.stand.onclick=()=>{seated=!seated;walking=false;motion=null;render();};ui.walk.onclick=()=>{walking=!walking;if(walking)seated=false;render();};ui.item.onchange=()=>{play=-1;writing=false;render();};ui.pitch.oninput=ui.yaw.oninput=()=>render();document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);render();});
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{carrying=true;paused=true;play=-1;ui.pitch.value='.40';for(let i=0;i<120;i++)render(1/60);play=0;for(let i=0;i<Math.round(Number(b.dataset.phase)*60);i++)render(1/60);});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=(camera.aspect<.9?69:62)-(ui.role.value==='teacher'?6:0);camera.updateProjectionMatrix();render();}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.08):1/60;last=now;render(paused?0:dt);}requestAnimationFrame(frame);
window.firstPersonReview={get hands(){return hands},renderer,camera,view,replay(){ui.replay.click();},step(){ui.step.click();}};
}catch(error){ui.error.textContent=error.stack||error;throw error;}
</script></html>
