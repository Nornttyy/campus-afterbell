<!doctype html><html lang="zh"><meta charset="utf-8"><title>模型减面前后比较</title><style>body{margin:0;background:#e7efef;font:15px sans-serif}nav{position:absolute;top:12px;left:12px;display:flex;gap:8px}select,button{padding:8px}#labels{position:absolute;bottom:20px;left:0;width:100%;display:flex;justify-content:space-around}canvas{display:block}</style><nav><select id="role" aria-label="角色"><option value="boy">男同学</option><option value="girl">紫发女生</option><option value="ponytail">马尾女生</option><option value="glasses">眼镜同学</option><option value="teacher">老师</option></select><select id="view" aria-label="角度"><option value="0">正面</option><option value=".7854">斜侧</option><option value="1.5708">侧面</option><option value="3.14159">背面</option></select></nav><div id="labels"><span>减面前</span><span>减面后 · ≤8000三角面</span></div><script type="module">
import * as T from '../dist/vendor/three.module.js';import{GLTFLoader}from'../dist/vendor/addons/loaders/GLTFLoader.js';import{createRiggedStudent}from'../dist/student-assets.js?v=mesh64';import{createRiggedTeacher}from'../dist/imported-actors.js?v=mesh64';
const files={boy:'student-boy-v4',girl:'student-girl-v4',glasses:'student-glasses-v2',ponytail:'student-ponytail-v1',teacher:'teacher-v2'},scene=new T.Scene();scene.background=new T.Color('#e7efef');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.1,4.6);camera.lookAt(0,.95,0);const loader=new GLTFLoader();let actors=[];const role=document.querySelector('#role'),view=document.querySelector('#view');async function show(){for(const a of actors){scene.remove(a.group);a.dispose?.();}actors=[];const key=role.value;for(const [i,folder]of ['art-source/mesh-budget64/originals','dist/assets/models'].entries()){const source=await loader.loadAsync('../'+folder+'/'+files[key]+'.glb?v=mesh64-final-d');const a=key==='teacher'?createRiggedTeacher(source):createRiggedStudent(source,{seated:false,variant:key,metric:true});if(key!=='teacher'){a.setMood('resting');a.setMotion({seated:false,speed:0});}for(let n=0;n<120;n++)a.update(n/60,key==='teacher'?{walking:0,phase:'scan'}:undefined);a.group.position.x=i?1:-1;a.group.rotation.y=Number(view.value);actors.push(a);scene.add(a.group);}}role.onchange=show;view.onchange=()=>{for(const a of actors)a.group.rotation.y=Number(view.value);};await show();function frame(){requestAnimationFrame(frame);renderer.render(scene,camera)}frame();
</script></html>
