<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>学生捕获动作检查</title>
<style>
body{margin:0;background:#e7ecea;font:14px system-ui;color:#243431}canvas{display:block}#controls{position:fixed;left:12px;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:8px 11px;border:1px solid #a9bbb5;border-radius:5px;background:#fffffff2;color:inherit}button:active{background:#b5ded0}output{position:fixed;bottom:16px;left:18px;background:#ffffffdf;padding:10px 14px;border-radius:6px}label{padding:6px;background:#ffffffdf;border-radius:5px}
</style>
<div id="controls">
<select id="variant" aria-label="学生"><option value="boy">男同学</option><option value="girl">女同学</option><option value="glasses">眼镜同学</option><option value="ponytail">棕色长发同学</option></select>
<label><input id="seated" type="checkbox">坐姿底片</label>
<button data-kind="free">待机</button><button data-kind="stunned">眩晕</button><button data-kind="carried">抓颈</button><button data-kind="bound">绑柱</button><button id="release">救下</button><button id="sequence">连续过程</button><button id="play">播放 / 暂停</button>
<button data-angle="0">正面</button><button data-angle="1.5708">侧面</button><button data-angle="3.14159">背面</button>
</div>
<output id="label">加载模型</output>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadStudentAssets} from '../dist/student-assets.js?v=campus-62';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#e7ecea');scene.add(new T.HemisphereLight('#fff5e9','#9ca8a4',2));const light=new T.DirectionalLight('#fff7eb',2.5);light.position.set(3,5,4);scene.add(light);
const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,30),pivot=new T.Group();scene.add(pivot);
const floor=new T.Mesh(new T.PlaneGeometry(12,12),new T.MeshStandardMaterial({color:'#cbd4cb',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
const post=new T.Mesh(new T.CylinderGeometry(.085,.10,2.06,12),new T.MeshStandardMaterial({color:'#aa784b',roughness:.92}));post.position.set(0,1.03,-.39);pivot.add(post);
const assets=await loadStudentAssets();let actor,clock=0,playing=false,sequence=false,sequenceTime=0,current={variant:'boy',kind:'bound',time:1.5,angle:0,seated:false,release:false};
function render(){renderer.render(scene,camera);}
function motion(state){actor.setMood(state==='free'?(current.seated?'writing':'resting'):state);actor.setMotion({seated:current.seated,speed:0,restraint:state});}
function label(){document.querySelector('#label').textContent=`${current.variant} · ${actor.diagnostics().capture.kind} · ${current.time.toFixed(2)} 秒`;}
function advance(state,duration){motion(state);for(let i=0;i<Math.ceil(duration*60);i++)actor.update(clock+=1/60);}
function set(options={}){
 current={variant:'boy',kind:'bound',time:1.5,angle:0,seated:false,release:false,...options};playing=false;sequence=false;clock=0;
 if(actor){pivot.remove(actor.group);actor.dispose();}actor=assets.createStudent({variant:current.variant,seated:current.seated});pivot.add(actor.group);
 advance('free',1);if(current.kind==='carried'||current.kind==='bound'||current.release)advance('stunned',.35);if(current.kind==='bound'||current.release)advance('carried',1.3);if(current.release)advance('bound',1.6);advance(current.release?'free':current.kind,current.time);
 actor.group.position.y=['carried','bound'].includes(current.kind)&&!current.release?.20:0;post.visible=current.kind==='bound'||current.release;pivot.rotation.y=current.angle;
 camera.position.set(0,1.12,3.75);camera.lookAt(0,.96,0);label();render();return actor.diagnostics();
}
const selection=()=>({variant:document.querySelector('#variant').value,seated:document.querySelector('#seated').checked,angle:current.angle});
for(const button of document.querySelectorAll('[data-kind]'))button.onclick=()=>set({...selection(),kind:button.dataset.kind,time:button.dataset.kind==='stunned'?.35:1.5});
for(const button of document.querySelectorAll('[data-angle]'))button.onclick=()=>{current.angle=Number(button.dataset.angle);pivot.rotation.y=current.angle;render();};
document.querySelector('#variant').onchange=()=>set({...current,...selection()});document.querySelector('#seated').onchange=()=>set({...current,...selection()});
document.querySelector('#release').onclick=()=>set({...selection(),kind:'free',time:.2,release:true});
document.querySelector('#play').onclick=()=>{playing=!playing;};
document.querySelector('#sequence').onclick=()=>{set({...selection(),kind:'free',time:0});sequence=true;sequenceTime=0;playing=true;};
let previous=0;function frame(ms){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(0,(ms-previous)/1000));previous=ms;if(!playing)return;
 if(sequence){sequenceTime+=dt;const state=sequenceTime<1?'free':sequenceTime<1.6?'stunned':sequenceTime<3.8?'carried':sequenceTime<6.2?'bound':'free';motion(state);current.kind=state;post.visible=sequenceTime>=3.8;actor.group.position.y=T.MathUtils.damp(actor.group.position.y,['carried','bound'].includes(state)?.20:0,14,dt);if(sequenceTime>8){sequence=false;playing=false;}}
 actor.update(clock+=dt);current.time+=dt;label();render();
}requestAnimationFrame(frame);
window.captureQA={set,render,get actor(){return actor;}};set();window.qaReady=true;
</script>
</html>
