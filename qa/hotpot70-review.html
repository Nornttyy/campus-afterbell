<!doctype html><html lang="zh"><meta charset="utf-8"><title>火锅教室模型核对</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e5e8e4;font:14px system-ui}canvas{display:block;width:100%;height:100%}nav{position:absolute;left:15px;top:15px;display:flex;gap:8px;align-items:center;padding:9px;background:#fffde9e6;border-radius:6px}button{padding:7px 12px;border:1px solid #c4c3b7;background:#fffdf2;cursor:pointer}output{margin-left:8px}</style>
<canvas></canvas><nav><button data-view="front">前部全景</button><button data-view="rear">后部屏风</button><button data-view="table">锅桌近景</button><button data-view="top">布局</button><output>加载实际椅子与抽屉…</output></nav>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {OrbitControls} from '../dist/vendor/addons/controls/OrbitControls.js';
import {createHotpotRoom,HOTPOT_SEATS} from '../dist/hotpot-room70.js';
import {hotpotHelpers} from './hotpot70-helpers.mjs';
import {loadDeskModel} from '../dist/imported-actors.js';
const scene=new T.Scene();scene.background=new T.Color('#e9ebe5');const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,100),renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const h=hotpotHelpers(scene,{textureDraw:true}),room=createHotpotRoom(h);
scene.add(new T.HemisphereLight('#e6f2ff','#baa886',2.6));const sun=new T.DirectionalLight('#fff2d7',4.2);sun.position.set(-12,9,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:13,bottom:-13,near:1,far:45});sun.shadow.normalBias=.018;scene.add(sun);const fill=new T.DirectionalLight('#f4edda',1.05);fill.position.set(7,5,4);scene.add(fill);
const floorTex=h.texture(512,512,(c,w,hh)=>{c.fillStyle='#c2c4bb';c.fillRect(0,0,w,hh);for(let i=0;i<3600;i++){const x=(i*47.721)%w,y=(i*71.313)%hh;c.fillStyle=i%3?'#e0e0d4':'#8a938e';c.fillRect(x,y,2+(i%4),2+(i%3));}});floorTex.wrapS=floorTex.wrapT=T.RepeatWrapping;floorTex.repeat.set(8,11);const floor=h.mat('#fff',{map:floorTex,roughness:.78});h.box(floor,[.275,-.08,-.6],[13.85,.16,18.8]);
const cream=h.mat('#ebe8d6'),trim=h.mat('#557f76'),glass=h.mat('#c9e0e2',{roughness:.2,metalness:.08});h.box(cream,[.275,2.22,-10.05],[13.85,4.44,.1]);h.box(cream,[.275,2.22,8.85],[13.85,4.44,.1]);h.box(cream,[-6.7,.60,-.6],[.1,1.2,18.8]);h.box(cream,[7.25,.60,-.6],[.1,1.2,18.8]);
for(const x of[-6.7,7.25]){h.box(cream,[x,4.02,-.6],[.1,.84,18.8]);for(let z=-9;z<8;z+=2.7){h.box(cream,[x,2.5,z],[.12,2.2,.3]);h.box(glass,[x,2.5,z+1.35],[.06,2.1,2.35]);for(const y of[1.47,2.65,3.52])h.box(trim,[x+(x<0?.05:-.05),y,z+1.35],[.06,.065,2.4]);h.box(trim,[x+(x<0?.05:-.05),2.5,z+1.35],[.06,2.1,.06]);}}
h.box(h.mat('#1e5145'),[.1,2.40,8.76],[8.5,1.6,.05]);h.box(h.mat('#c9b791'),[.1,1.57,8.75],[8.7,.07,.12]);
try{const desk=await loadDeskModel();for(const s of HOTPOT_SEATS){const chair=desk.chair.clone(true);chair.position.set(s.x,0,s.z);chair.rotation.y=s.yaw;scene.add(chair);const drawer=desk.drawer.clone(true);drawer.position.set(s.deskX,0,s.deskZ);drawer.rotation.y=s.yaw;scene.add(drawer);const anchor=new T.Group();anchor.position.set(s.deskX,0,s.deskZ);anchor.rotation.y=s.yaw;scene.add(anchor);h.rounded(h.mat('#efe6c8'),[0,.880,-.23],[.60,.012,.42],.002,null,anchor);h.box(h.mat('#b04b35'),[.39,.892,.12],[.018,.015,.21],null,anchor);}document.querySelector('output').textContent='24 个实际椅子/抽屉 · 鼠标旋转检视';}catch(e){document.querySelector('output').textContent=e.message;throw e;}
const views={front:[[5.9,1.95,6.25],[-.3,1,-3.5]],rear:[[-.2,1.75,-8.6],[0,1.3,-3.8]],table:[[.8,1.9,5.0],[3.2,.95,2.6]],top:[[.25,16,-.6],[.25,0,-.6]]};function setView(key){camera.position.set(...views[key][0]);controls.target.set(...views[key][1]);controls.update();}setView('front');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};renderer.setAnimationLoop(t=>{room.update(t/1000);controls.update();renderer.render(scene,camera);});
window.hotpotReview={room,scene,camera,renderer,setView};
</script></html>
