<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>操场独立场景检查</title>
<style>html,body{margin:0;font:14px system-ui;background:#7dcad8}canvas{display:block}nav{position:fixed;top:10px;left:10px;display:flex;gap:8px;align-items:center;background:#fffe;border-radius:6px;padding:9px}button,select{padding:7px;font:inherit}output{position:fixed;bottom:10px;left:10px;background:#fffe;padding:10px;border-radius:4px;white-space:pre}</style>
<nav><select id="view"><option value="overview">全景</option><option value="entry">右侧入口</option><option value="track">沿跑道</option><option value="stage">绑柱台</option><option value="vending">售货机</option><option value="board">教师黑板</option><option value="teacher">师生比例</option></select><button id="walk">点击画面走动</button><span>WASD · 鼠标转向 · Esc 退出</span></nav><output id="stats"></output>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {createPlaygroundRoom} from '../dist/playground-room70.js?v=campus-76';
import {loadTeacherModel} from '../dist/imported-actors.js?v=campus-76';
import {loadStudentAssets} from '../dist/student-assets.js?v=campus-76';
import {playgroundWalkable} from '../dist/playground-layout70.js?v=campus-76';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,180);scene.background=new T.Color('#7ed3dd');scene.add(new T.HemisphereLight('#e6f9ff','#b8ad87',2.0));const sun=new T.DirectionalLight('#fff3d4',3.0);sun.position.set(-8,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-17,right:17,top:21,bottom:-21,near:1,far:55});sun.shadow.bias=-.00015;sun.shadow.normalBias=.025;scene.add(sun);
const room=createPlaygroundRoom({parent:scene}),p=room.layout,select=document.querySelector('#view'),status=document.querySelector('#stats');let yaw=0,pitch=0,last=performance.now(),keys=new Set();
const oldViews={overview:{pos:[10,11,15],to:[0,0,0]},entry:{pos:[7.3,1.6,7],to:[-3,1.4,0]},track:{pos:[-4.6,1.6,-6.6],to:[-3.8,1.5,5.4]},stage:{pos:[-3,1.6,-.4],to:[0,1.5,4.0]},vending:{pos:[3.1,1.6,-3.2],to:[6.8,1.1,-2.6]},board:{pos:[0,1.6,6.3],to:[0,1.4,8.6]}};
const cx=p.track.cx,cz=p.track.cz;
const views={overview:{pos:[p.bounds.maxX+14,31,p.bounds.maxZ+15],to:[cx,0,cz]},entry:{pos:[7.3,1.65,7],to:[cx,1.4,cz]},track:{pos:[cx+p.track.outerRadius-.65,1.65,cz-p.track.straightHalf+1],to:[cx+p.track.outerRadius-1,1.4,cz+p.track.straightHalf]},stage:{pos:[cx+4,1.65,p.steps[0].z-6],to:[cx,1.5,p.steps[0].z]},vending:{pos:[p.bounds.minX+4,1.65,p.vending[1].z+1.3],to:[p.vending[1].x,1.1,p.vending[1].z]},board:{pos:[cx,1.65,p.bounds.maxZ-3],to:[cx,1.4,p.bounds.maxZ]},teacher:{pos:[cx+1.4,1.65,cz+5.8],to:[cx+1.4,1.25,cz+2]}};
sun.position.set(cx-22,36,cz+20);sun.target.position.set(cx,0,cz);scene.add(sun.target);Object.assign(sun.shadow.camera,{left:-44,right:44,top:44,bottom:-44,far:140});sun.shadow.camera.updateProjectionMatrix();
const [teacher,factory]=await Promise.all([loadTeacherModel(),loadStudentAssets()]);const student=factory.createStudent({variant:'boy'});scene.add(teacher.group,student.group);teacher.group.position.set(cx+2.25,0,cz+2);student.group.position.set(cx+.55,0,cz+2);teacher.update(0,{phase:'watching'});student.setMotion({seated:false,speed:0});student.setMood('resting');student.update(0);

function choose(name){const view=views[name]||views.overview;camera.rotation.order='YXZ';camera.position.set(...view.pos);camera.lookAt(...view.to);yaw=camera.rotation.y;pitch=camera.rotation.x;}
select.onchange=()=>choose(select.value);const q=new URLSearchParams(location.search);select.value=q.get('view')||'overview';choose(select.value);
renderer.domElement.onclick=()=>renderer.domElement.requestPointerLock();document.querySelector('#walk').onclick=()=>{choose('entry');renderer.domElement.requestPointerLock();};
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=T.MathUtils.clamp(pitch-e.movementY*.002,-1.4,1.4);camera.rotation.set(pitch,yaw,0,'YXZ');}});addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(document.pointerLockElement===renderer.domElement){const f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),r=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),step=dt*2.6/Math.max(1,Math.hypot(f,r));let x=camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*step,z=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*step;const y=room.floorHeight(x,z);const solid=room.colliders.some(c=>!c.walkable&&x>=c.minX-.18&&x<=c.maxX+.18&&z>=c.minZ-.18&&z<=c.maxZ+.18&&y+.9<c.maxY);if(playgroundWalkable(x,z,.18,p)&&!solid&&y<=camera.position.y-1.6+.20)camera.position.set(x,y+1.6,z);}room.update(now/1000);teacher.update(now/1000,{phase:'watching',lookPitch:.14});student.update(now/1000);renderer.render(scene,camera);status.textContent=JSON.stringify({...room.diagnostics(),drawCalls:renderer.info.render.calls,visibleTriangles:renderer.info.render.triangles,reference:'视频截图布局重建；尺寸待核准'},null,2);}requestAnimationFrame(frame);
window.playgroundReview={room,scene,camera,renderer,choose};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
