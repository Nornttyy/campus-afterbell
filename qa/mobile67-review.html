<!doctype html><meta charset="utf-8"><title>校园连接检查</title><style>html,body{margin:0;background:#111;color:white;font:14px sans-serif}canvas{width:100vw;height:calc(100vh - 42px);display:block}nav{height:42px;display:flex;align-items:center;gap:14px;padding:0 10px}button,select{font:inherit}#note{margin-left:auto}</style>
<nav><select id="map"><option value="classroom">白天教室</option><option value="night">夜间教室</option><option value="tiered">阶梯教室</option><option value="computer">机房</option></select><select id="quality" aria-label="画质"><option value="high">精致</option><option value="low">流畅</option></select><button id="office">办公室</button><button id="officeInside">办公室内</button><button id="deskNear">新办公桌</button><button id="deskOpen">开/关抽屉</button><button id="corridor">走廊</button><button id="courtyard">窗外庭院</button><button id="front">教室前方</button><button id="angle">教室斜看</button><button id="rear">教室后方</button><button id="lift">电梯</button><button id="walk">走完整条路线</button><span id="note">加载中</span></nav><canvas id="canvas"></canvas>
<script type="module">
import {createClassroom} from '../dist/classroom.js?v=campus-75';
import {TeacherRound} from '../dist/teacher-rules.js?v=campus-75';
import {walkRoute,floorHeight,blocked,TEACHER_SPAWN} from '../dist/classroom-layout.js?v=campus-75';
const canvas=document.querySelector('#canvas'),scene=await createClassroom(canvas,{profile:true,renderDevice:new URL(location.href).searchParams.get('device')||'auto'}),select=document.querySelector('#map'),note=document.querySelector('#note');
let inspectDrawer=false;
let map=new URL(location.href).searchParams.get('map')||'tiered',round,route=[],last=0,trace=[],keys=new Set();select.value=map;
function reset(){round=new TeacherRound({map,target:100000});round.start();for(const s of round.students)s._decisionAt=Infinity;route=[];trace=[];scene.setMap(map);scene.setGameplay(round.snapshot());}
function place(x,z,yaw,pitch=0){route=[];Object.assign(round.player,{x,z,yaw,pitch});round.setLook(yaw,pitch);scene.setGameplay(round.snapshot());}
reset();
const quality=document.querySelector('#quality');quality.value=new URL(location.href).searchParams.get('device')==='mobile'?'low':'high';scene.setQuality(quality.value);quality.onchange=()=>scene.setQuality(quality.value);
document.querySelector('#office').onclick=()=>place(7.15,6.0,0,0);
document.querySelector('#officeInside').onclick=()=>place(6.70,9.60,-Math.PI/2,0);
document.querySelector('#deskNear').onclick=()=>place(4.80,11.25,0,.32);
document.querySelector('#deskOpen').onclick=()=>inspectDrawer=!inspectDrawer;
document.querySelector('#corridor').onclick=()=>place(7.2,4.80,Math.PI,0);
document.querySelector('#courtyard').onclick=()=>place(7.2,-1.0,Math.PI/2,.45);
document.querySelector('#front').onclick=()=>place(1.58,4.30,Math.PI,0);
document.querySelector('#angle').onclick=()=>place(-2.215,4.30,2.9,.06);
document.querySelector('#rear').onclick=()=>place(1.58,-5.45,0,.15);
document.querySelector('#lift').onclick=()=>place(7.15,-8.05,-.924,.518);
select.onchange=()=>{map=select.value;reset();};
function startRoute(){place(TEACHER_SPAWN.x,TEACHER_SPAWN.z,TEACHER_SPAWN.yaw,TEACHER_SPAWN.pitch);let point={x:TEACHER_SPAWN.x,z:TEACHER_SPAWN.z};route=[];for(const end of [{x:7.15,z:6.0},{x:7.15,z:4.96},{x:4.8,z:4.96},{x:1.58,z:4.15},{x:1.58,z:-5.35},{x:5.48,z:-5.14},{x:7.3,z:-5.14},{x:7.15,z:-8.05}]){const part=walkRoute(point,end,.20);if(!part.length)throw Error('No route '+JSON.stringify({point,end}));route.push(...part);point=end;}trace=[];}
document.querySelector('#walk').onclick=startRoute;
window.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&!e.repeat&&scene.getInteraction()?.kind==='lift'&&!scene.getInteraction().current){map=scene.getInteraction().map;select.value=map;reset();place(7.15,-8.05,0,0);}});window.addEventListener('keyup',e=>keys.delete(e.code));canvas.onclick=()=>canvas.requestPointerLock?.();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas)round.setLook(round.player.yaw-e.movementX*.0024,Math.max(-1.2,Math.min(1.2,round.player.pitch+e.movementY*.0021)));});
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;const p=round.player;if(route.length){const target=route[0],dx=target.x-p.x,dz=target.z-p.z,d=Math.hypot(dx,dz);if(d<.06)route.shift();round.setMovement(dx/Math.max(d,.001),dz/Math.max(d,.001));round.setLook(Math.atan2(dx,dz),.02);}else{const f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),s=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);round.setMovement(Math.sin(p.yaw)*f-Math.cos(p.yaw)*s,Math.cos(p.yaw)*f+Math.sin(p.yaw)*s);}round.step(dt);const state=round.snapshot();state.officeDeskOpen=inspectDrawer;state.officeDrawers=[{id:"office-lunch",open:inspectDrawer}];scene.setGameplay(state);const h=floorHeight(p.x,p.z,map);trace.push({x:p.x,z:p.z,h,blocked:blocked(p.x,p.z,.18)});if(trace.length>10000)trace.shift();note.textContent=`${map}  x ${p.x.toFixed(2)}  z ${p.z.toFixed(2)}  地面 ${h.toFixed(2)}  剩余路线 ${route.length}  ${scene.getInteraction()?.kind==='lift'?('E '+scene.getInteraction().map):''}`;requestAnimationFrame(frame);}
window.qaCampus={get round(){return round;},get trace(){return trace;},get remaining(){return route.length;},scene,place,startRoute,setMap(value){map=value;select.value=value;reset();}};requestAnimationFrame(frame);
</script>
