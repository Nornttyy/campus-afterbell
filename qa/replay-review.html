<!doctype html><html lang="zh"><meta charset="utf-8"><title>烟雾弹实录逐帧检查</title>
<style>body{margin:0;background:#111;color:white;font:15px sans-serif}nav{height:42px;display:flex;gap:20px;align-items:center;padding:0 12px}input{width:90px}video{display:block;width:100vw;height:calc(100vh - 42px);object-fit:contain}</style>
<nav>游戏画面实录 <label>时间（秒）<input id="seek" type="number" step=".1" min="0" max="11" value="2.8"></label><button id="next">下一帧（0.1秒）</button><button id="play">播放 / 暂停</button></nav><video id="clip" preload="auto" muted ></video>
<script>const clip=document.querySelector('#clip'),seek=document.querySelector('#seek');fetch('screenshots/smoke-throw-21.webm').then(r=>r.blob()).then(blob=>{clip.src=URL.createObjectURL(blob);});clip.addEventListener('loadeddata',()=>clip.currentTime=2.8,{once:true});seek.oninput=()=>{clip.pause();clip.currentTime=Number(seek.value)};document.querySelector('#next').onclick=()=>{clip.pause();seek.value=(Number(seek.value)+.1).toFixed(1);clip.currentTime=Number(seek.value)};document.querySelector('#play').onclick=()=>clip.paused?clip.play():clip.pause();</script></html>
