<!doctype html><html lang="zh"><meta charset="utf-8"><title>校园音效54试听</title><style>body{font:17px sans-serif;background:#f4f1e7;color:#263a35;max-width:900px;margin:35px auto;padding:16px}button{font:inherit;padding:13px 22px;margin:5px;border:1px solid #67857b;background:#fff;border-radius:6px}output{display:block;margin:18px 4px}input{width:250px}</style><h1>音效试听</h1><p>点击才发声，没有背景音乐。每个声音有多种变化，可连续点击检查重叠。</p><label>音量 <input id="volume" type="range" min="0" max="100" value="55"></label><div id="buttons"></div><output>待试听</output><script type="module">
import{playCampusFoley}from'../dist/foley-audio54.js';
let audio;const labels={'step':'脚步','drawer-open':'抽屉拉开','drawer-close':'抽屉合上','rear-door':'门闩与关门','book-open':'翻开书','book-close':'合上书','pen-pickup':'拿笔','pen-putdown':'放笔','pen-write':'写字','pen-twirl':'转笔','chair':'椅子移动',snack:'包装与咀嚼',burger:'汉堡',drink:'饮料',tap:'菜单按下',open:'打开菜单',bell:'校铃','flash-burst':'闪光弹','ink-splash':'墨水','smoke-bloom':'烟雾'};
async function start(){if(!audio){const context=new AudioContext(),fx=context.createGain();fx.connect(context.destination);audio={context,fx};}audio.fx.gain.value=Number(document.querySelector('#volume').value)/100*.55;await audio.context.resume();}
for(const[k,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{await start();playCampusFoley(audio,k);document.querySelector('output').textContent=label;};document.querySelector('#buttons').append(b);}
document.querySelector('#volume').oninput=()=>{if(audio)audio.fx.gain.value=Number(document.querySelector('#volume').value)/100*.55;};
</script></html>
