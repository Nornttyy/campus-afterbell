<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>59 · 已保存动作的正式场景验证</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ebf2f3;font:14px system-ui;color:#20303b}canvas{display:block;width:100%;height:100%}nav{position:fixed;z-index:4;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:7px;max-width:96vw;width:max-content;background:#fff9e9ed;padding:10px;border:1px solid #8c928b;border-radius:5px}button,a,select{font:inherit;padding:7px 10px;color:inherit}button[aria-pressed=true]{background:#d4e9f1}output{flex-basis:100%;text-align:center;white-space:pre-wrap}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f4efe4}[hidden]{display:none!important}#error{color:#a22222}label{display:flex;gap:5px;align-items:center}
</style></head><body><canvas id="classroom"></canvas><div id="loading">载入正式教室和真实手模…</div><nav id="tools"><label>角色<select id="role"><option value="student">学生</option><option value="teacher">老师</option></select></label><button data-motion="idle" aria-pressed="true">待机</button><button data-motion="walk">沿走廊走路</button><button data-motion="crawl-idle">爬行待机</button><button data-motion="crawl">沿走廊爬行</button><label>低头<input id="pitch" type="range" min="0" max="65" value="22"></label><button id="reload">重新读取已保存动作</button><a href="./animation-editor.html?v=campus-67" target="_blank" rel="noopener">打开编辑器</a><button id="hide">隐藏面板（` 恢复）</button><output id="state">准备中</output><output id="error"></output></nav><script type="module">
import {createClassroom} from './classroom.js?v=campus-67';
import {createSoloRound,switchSoloRole} from './solo-round.js?v=campus-67';
import {loadHandAnimations,HAND_ANIMATION_CHANGE_EVENT,HAND_ANIMATION_STORAGE_KEY} from './hand-animation-runtime59.js?v=campus-67';
import {PUBLISHED_HAND_ANIMATIONS} from './published-hand-animations61.js?v=campus-67';
const $=id=>document.getElementById(id),canvas=$('classroom');let failure='',disposed=false,mode='idle',direction=-1,scene,frame,round=createSoloRound({role:'student',seed:73,map:'classroom'}),saved=loadHandAnimations();
function fail(e){failure=String(e?.message||e);$('error').textContent=failure;}
addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason));
function reread(){saved=loadHandAnimations();}
addEventListener('storage',e=>{if(e.key===HAND_ANIMATION_STORAGE_KEY||e.key===null)reread();});addEventListener(HAND_ANIMATION_CHANGE_EVENT,reread);
try{
 scene=await createClassroom(canvas,{active:true,snapEntry:true});round.start({gathering:true});
 function choose(next){mode=next.startsWith('crawl')&&round.player.id===-1?'idle':next;round.setCrouch(mode.startsWith('crawl'));for(const b of document.querySelectorAll('[data-motion]'))b.setAttribute('aria-pressed',String(b.dataset.motion===mode));}
 for(const b of document.querySelectorAll('[data-motion]'))b.onclick=()=>choose(b.dataset.motion);
 $('role').onchange=()=>{const next=switchSoloRole(round,$('role').value);if(next){round=next;choose(mode);}for(const button of document.querySelectorAll('[data-motion^=crawl]'))button.disabled=round.player.id===-1;};
 $('reload').onclick=()=>dispatchEvent(new Event(HAND_ANIMATION_CHANGE_EVENT));$('hide').onclick=()=>$('tools').hidden=true;addEventListener('keydown',e=>{if(e.code==='Backquote')$('tools').hidden=!$('tools').hidden;});
 let previous=performance.now(),lastOutput=0;function loop(now){if(disposed)return;const dt=Math.max(0,Math.min(.05,(now-previous)/1000));previous=now;const p=round.player;
  // Use the actual round's movement/collision and scene displacement tracker.
  // The initial gathering position is unchanged; no moving camera or fake hands.
  if(mode==='walk'||mode==='crawl'){if(p.z<-6)direction=1;if(p.z>4.5)direction=-1;round.setLook(direction<0?Math.PI:0,Number($('pitch').value)*Math.PI/180);round.setMovement(0,direction);}else{round.setMovement(0,0);round.setLook(p.yaw,Number($('pitch').value)*Math.PI/180);}
  round.step(dt);scene.setGameplay(round.snapshot());if(now-lastOutput>100){lastOutput=now;let debug={};try{debug=JSON.parse(canvas.dataset.handsDebug||'{}');}catch{}const role=round.player.id===-1?'teacher':'student',id=mode==='idle'?`${role}-idle`:role==='teacher'?'teacher-walk':mode==='crawl-idle'?'student-crawl-idle':mode==='crawl'?'student-crawl':'student-walk';$('state').textContent=`${role==='teacher'?'老师':'学生'} · ${mode} · 动作来源 ${saved?(saved.clips[id]?'本机保存':'原动作'):PUBLISHED_HAND_ANIMATIONS.clips[id]?'已发布':'原动作'} · 正式手模已应用 ${debug.authoredAnimation?'是':'否'}\n真实位置 ${p.x.toFixed(2)}, ${p.z.toFixed(2)} · 移动权重 ${Number(debug.walkAmount||0).toFixed(2)} · 爬行 ${Number(debug.crawlBlend||0).toFixed(2)} · sceneTime ${Number(debug.gameTime||0).toFixed(2)}`;canvas.dataset.runtimeReview=JSON.stringify({role,mode,clip:id,saved:Boolean(saved?.clips[id]),applied:Boolean(debug.authoredAnimation),position:{x:p.x,z:p.z},sceneTime:debug.gameTime,failure});}
  frame=requestAnimationFrame(loop);
 }
 frame=requestAnimationFrame(loop);$('loading').hidden=true;window.qaReady=true;window.handRuntime59QA={scene,get round(){return round;},choose,reread};
}catch(e){fail(e);$('loading').textContent='加载失败：'+failure;}
addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(frame);scene?.dispose();},{once:true});
</script></body></html>
