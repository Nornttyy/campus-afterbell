<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景电脑屏幕检查</title><style>body{margin:0;background:#c8d3d2;font:16px system-ui}nav{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}button{padding:8px 14px}output{position:absolute;bottom:10px;left:10px;background:white;padding:7px}canvas{display:block}</style><nav><button data-app="desktop">桌面</button><button data-app="photoshop">Photoshop</button><button data-app="unity">Unity</button><button data-app="snake">贪吃蛇</button><button data-app="valorant">VALORANT 视频</button><button id="next">选择下一个</button></nav><canvas aria-label="电脑屏幕"></canvas><output>载入</output><script type="module">
import * as T from '../dist/vendor/three.module.js';import {createComputerScreenContent} from '../dist/computer-screen55.js?v=campus-81';
const canvas=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas,antialias:true}),s=new T.Scene(),camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,20);r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;camera.position.set(0,.28,2.6);camera.lookAt(0,.12,0);s.background=new T.Color('#c8d3d2');
const frame=new T.Mesh(new T.BoxGeometry(1.96,1.14,.09),new T.MeshBasicMaterial({color:'#2b343c'}));s.add(frame);const screen=new T.Mesh(new T.PlaneGeometry(1.83,1.03));screen.position.z=.05;s.add(screen);const stem=new T.Mesh(new T.BoxGeometry(.13,.35,.13),new T.MeshBasicMaterial({color:'#687679'}));stem.position.y=-.72;s.add(stem);const base=new T.Mesh(new T.BoxGeometry(.6,.04,.35),stem.material);base.position.y=-.88;s.add(base);const screens=new Map([[0,screen]]),content=createComputerScreenContent(),computer={active:true,app:'desktop',selectedApp:0};const player={id:0,seatId:0,seated:true,computer};const state={status:'playing',paused:false,player,students:[player]};
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>computer.app=b.dataset.app);document.querySelector('#next').onclick=()=>computer.selectedApp=(computer.selectedApp+1)%4;
function draw(){requestAnimationFrame(draw);content.update(state,screens);r.render(s,camera);document.querySelector('output').textContent=JSON.stringify({...content.diagnostics(),playback:content.getPlayback()});}draw();
</script></html>
