<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物受光隔离检查</title>
<style>body{margin:0;font:14px system-ui;background:#e8edef;color:#283c45}nav{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;box-sizing:border-box}select,button{font:inherit;padding:5px 8px}#labels{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;top:70px;width:100%;pointer-events:none;text-align:center}#labels span{background:#ffffffdd;padding:8px 12px;border-radius:6px;justify-self:center}canvas{display:block}footer{position:fixed;bottom:0;background:#fffffff0;padding:9px 14px;left:0;right:0;font-size:12px}#status{margin-left:auto}</style>
<nav><select id="role"><option value="boy">男同学</option><option value="girl">紫发女生</option><option value="ponytail">棕马尾女生</option><option value="glasses">眼镜同学</option><option value="teacher">老师</option></select><select id="angle"><option value="0">正面</option><option value=".65">斜侧</option><option value="1.570796">侧面</option><option value="3.141593">背面</option></select><label><input type="checkbox" id="roof">顶面遮挡（隔离测试）</label><label><input type="checkbox" id="normal" checked>原法线贴图</label><span id="status">正在加载</span></nav>
<div id="labels"><span>课堂光照＋角色阴影</span><span>仅关角色接收阴影</span><span>关接收阴影＋柔和填光</span><span>贴图原色（无受光）</span></div>
<footer>同一模型、姿势、原始贴图。前三栏曝光 1.08、半球光 2.5、太阳光 4、补光 0.85；第三栏额外环境填光 0.75。只隔离人物自身受光，不代表完整教室。没有改动游戏或素材。</footer>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadStudentAssets} from '../dist/student-assets.js?v=campus-64';
import {loadTeacherModel} from '../dist/imported-actors.js?v=campus-64';
const ui=Object.fromEntries(['role','angle','roof','normal','status'].map(k=>[k,document.getElementById(k)]));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.setScissorTest(true);document.body.append(renderer.domElement);
function cloneRig(source){const root=source.clone(true),map=new Map();function pair(a,b){map.set(a,b);a.children.forEach((child,i)=>pair(child,b.children[i]));}pair(source,root);source.traverse(o=>{if(o.isSkinnedMesh){const n=map.get(o);n.skeleton=o.skeleton.clone();n.skeleton.bones=o.skeleton.bones.map(b=>map.get(b));n.bindMatrix.copy(o.bindMatrix);n.bind(n.skeleton,n.bindMatrix);n.frustumCulled=false;}});return root;}
const views=Array.from({length:4},(_,index)=>{const scene=new T.Scene();scene.background=new T.Color('#dfe8e8');scene.add(new T.HemisphereLight('#edf5ff','#dce3e3',2.5));const sun=new T.DirectionalLight('#fff8ed',4);sun.position.set(-10.7,6.4,6.7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:35});sun.shadow.bias=-.00015;sun.shadow.normalBias=.012;sun.shadow.radius=2.2;sun.shadow.intensity=.92;scene.add(sun);const fill=new T.DirectionalLight('#e5eef4',.85);fill.position.set(5,4,6);scene.add(fill);if(index===2)scene.add(new T.AmbientLight('#ffffff',.75));const roof=new T.Mesh(new T.BoxGeometry(12.08,.16,13.58),new T.MeshStandardMaterial({color:'#f2f3ef',roughness:.93}));roof.position.set(0,4.59,-.05);roof.castShadow=true;roof.visible=false;scene.add(roof);const camera=new T.PerspectiveCamera(28,1,.02,40);return{index,scene,camera,roof,root:null,materials:[]};});
let assets,teacher;
try{[assets,teacher]=await Promise.all([loadStudentAssets(),loadTeacherModel()]);}catch(error){ui.status.textContent=error.message;throw error;}
function select(){for(const view of views){if(view.root){view.scene.remove(view.root);view.actor?.dispose?.();for(const m of view.materials)m.dispose();}view.materials=[];let root;if(ui.role.value==='teacher'){teacher.update(0,{speed:0,phase:'scan'});root=cloneRig(teacher.group);view.actor=null;}else{const actor=assets.createStudent({variant:ui.role.value,seated:false,seed:0});actor.setMood('resting');actor.setMotion({seated:false,speed:0});actor.update(0);root=actor.group;view.actor=actor;}root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=view.index===0;const mats=[o.material].flat().map(source=>{const m=view.index===3?new T.MeshBasicMaterial({map:source.map,color:source.color,side:source.side,transparent:source.transparent,opacity:source.opacity,toneMapped:false}):source.clone();m.userData.originalNormal=m.normalMap;view.materials.push(m);return m;});o.material=Array.isArray(o.material)?mats:mats[0];}});view.root=root;view.scene.add(root);}render();}
function render(){const width=innerWidth,height=innerHeight-52;renderer.setSize(width,height);const cell=width/4;for(const view of views){view.root.rotation.y=Number(ui.angle.value);view.root.updateMatrixWorld(true);let head;view.root.traverse(o=>{if(o.isBone&&/Head$/.test(o.name))head=o;});const center=head?head.getWorldPosition(new T.Vector3()).add(new T.Vector3(0,.20,0)):new T.Vector3(0,1.55,0);view.camera.aspect=cell/height;view.camera.position.copy(center).add(new T.Vector3(0,.02,2.1));view.camera.lookAt(center);view.camera.updateProjectionMatrix();view.roof.visible=ui.roof.checked;for(const m of view.materials){const map=ui.normal.checked?m.userData.originalNormal:null;if(m.isMeshStandardMaterial&&m.normalMap!==map){m.normalMap=map;m.needsUpdate=true;}}renderer.setViewport(view.index*cell,0,cell,height);renderer.setScissor(view.index*cell,0,cell,height);renderer.render(view.scene,view.camera);}ui.status.textContent='原纹理 · '+ui.role.value;}
for(const k of ['angle','roof','normal'])ui[k].onchange=render;ui.role.onchange=select;addEventListener('resize',render);select();
window.lighting40={renderer,views,render};
</script></html>
