<!doctype html><meta charset="utf-8"><title>新模型方向检查</title><style>body{margin:0;background:#e7efef;font:15px sans-serif}#cards{display:grid;grid-template-columns:repeat(4,1fr)}.card{height:270px;position:relative}.label{position:absolute;left:12px;bottom:8px}nav{height:35px}canvas{width:100%;height:100%}</style><nav><select id="source" aria-label="版本"><option value="raw">原始</option><option value="runtime">游戏</option></select></nav><div id="cards"></div><script type="module">
import * as T from '../dist/vendor/three.module.js';import {GLTFLoader} from '../dist/vendor/addons/loaders/GLTFLoader.js';
const names=['phone','mouse','computer-tower','keyboard','gum','cabinet','lunch','pen','office-desk','office-chair','monitor'],loader=new GLTFLoader(),source=document.querySelector('#source');source.value=new URL(location.href).searchParams.get('source')||'raw';source.onchange=()=>location.search='?source='+source.value;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(320,240);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;
for(const name of names){const c=document.createElement('div');c.className='card';const canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;const label=document.createElement('div');label.className='label';label.textContent=name+' 加载中';c.append(canvas,label);document.querySelector('#cards').append(c);try{const gltf=await loader.loadAsync(source.value==='raw'?'../art-source/tripo67/originals/'+name+'.glb':'../dist/assets/models/'+name+'-v67.glb');const root=gltf.scene,b=new T.Box3().setFromObject(root),size=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());root.position.sub(center);const fit=1.3/Math.max(...size.toArray()),g=new T.Group();g.add(root);g.scale.setScalar(fit);const s=new T.Scene();s.background=new T.Color('#e7efef');s.add(g,new T.HemisphereLight('#ffffff','#8a9eaa',2.5));const l=new T.DirectionalLight('#fff7ed',3);l.position.set(-2,3,4);s.add(l);const camera=new T.OrthographicCamera(-1,1,.75,-.75,.01,10);camera.position.set(2,1.1,3);camera.lookAt(0,0,0);renderer.render(s,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);let tris=0;g.traverse(o=>{if(o.isMesh)tris+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;});label.textContent=name+' · '+tris+'面 · '+size.toArray().map(n=>n.toFixed(3)).join('/');}catch(e){label.textContent=name+' 未就绪';}}
</script>
