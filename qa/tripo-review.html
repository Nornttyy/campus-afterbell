<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Tripo 模型动作检查</title>
<style>body{margin:0;background:#dfe8ec;font:15px system-ui}canvas{display:block}nav{position:fixed;top:15px;left:15px;background:#fff;padding:12px;border-radius:8px;display:flex;gap:12px}select,button{padding:8px}#status{position:fixed;bottom:15px;left:15px}</style>
<nav><select id="pose"><option value="watching">待机</option><option value="patrol">走路</option><option value="board">板书</option><option value="card">举牌</option><option value="throw">投粉笔</option></select><select id="angle"><option value="0">正面</option><option value="0.785398">斜侧</option><option value="1.570796">侧面</option><option value="3.141593">背面</option></select><button id="pause">暂停</button></nav><div id="status">正在加载实际 GLB…</div>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadTeacherModel} from '../dist/imported-actors.js?v=campus-82';
const r=new T.WebGLRenderer({antialias:true});document.body.append(r.domElement);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.NeutralToneMapping;r.toneMappingExposure=1.12;
const s=new T.Scene();s.background=new T.Color('#dfe8ec');s.add(new T.HemisphereLight('#fff5e9','#9aa8ae',2.1));
for(const [p,power]of [[[2,4,3],2.5],[[-3,2,-2],1]]){const l=new T.DirectionalLight('#ffffff',power);l.position.set(...p);s.add(l);}
const floor=new T.Mesh(new T.PlaneGeometry(10,10),new T.MeshStandardMaterial({color:'#d0d6d4',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;s.add(floor);
const c=new T.PerspectiveCamera(34,1,.01,30);c.position.set(0,1.1,4.2);c.lookAt(0,1.05,0);
const a=await loadTeacherModel();s.add(a.group);document.querySelector('#status').textContent='实际模型 · 29,814 三角面 · 5 个骨骼动作';
let paused=false,time=0,last=0;document.querySelector('#pause').onclick=()=>paused=!paused;
function resize(){r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.06,(now-last)/1000);last=now;if(!paused)time+=dt;const pose=document.querySelector('#pose').value;a.setGesture({card:pose==='card',cast:pose==='throw'?(time%1.6)/1.6:0});a.update(time,{walking:pose==='patrol'?1:0,phase:pose});a.group.rotation.y=+document.querySelector('#angle').value;r.render(s,c)}requestAnimationFrame(frame);
</script></html>
