<!doctype html><html lang="zh"><meta charset="utf-8"><title>人物模型对照</title><style>body{margin:0;background:#dce5e9;font:14px sans-serif;color:#26343c}canvas{width:100vw;height:100vh;display:block}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button,select{border:1px solid #79929a;border-radius:5px;padding:10px 18px;background:#fff;color:#20373e;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2c687d;color:#fff}#labels{position:fixed;top:18px;width:100%;display:flex;justify-content:space-around;pointer-events:none}[hidden]{display:none!important}#labels span{background:#fff9;padding:8px 12px;border-radius:4px}</style><canvas id="c"></canvas><div id="labels"><span>短发</span><span>眼镜</span><span>短发女生</span><span>马尾</span><span>老师</span></div><nav><select id="focus" aria-label="检视对象"><option value="all">全体</option><option value="0">男生近景</option><option value="2">女生近景</option><option value="4">老师近景</option></select><select id="mood" aria-label="检视动作"><option value="auto">默认动作</option><option value="resting">休息</option><option value="writing">写字</option><option value="snack">吃东西</option><option value="hero">举手</option></select><button data-view="0" aria-pressed="true">正面</button><button data-view="0.65">斜侧</button><button data-view="1.5708">侧面</button><button data-view="3.1416">背面</button><button id="pose">坐姿</button></nav><script type="module">
import * as T from '../dist/vendor/three.module.js';import{createStudent}from'../dist/characters.js?v=campus-83';import{createTeacher}from'../dist/game-actors.js?v=campus-83';
const canvas=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(1.5,devicePixelRatio));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;r.toneMappingExposure=1.12;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#dce5e9');const camera=new T.PerspectiveCamera(31,1,.1,30);camera.position.set(0,2.1,8);camera.lookAt(0,1.04,0);scene.add(new T.HemisphereLight('#f5f7fc','#9d9279',1.1));const sun=new T.DirectionalLight('#fff2d5',3.1);sun.position.set(-4,6,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new T.DirectionalLight('#fff0dc',.95);fill.position.set(5,4,6);scene.add(fill);const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#cbd5d7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let actors=[],seated=false,angle=0;const profiles=[['boy',3],['boy',4],['girl',5],['girl',3]];function make(){actors.forEach(a=>scene.remove(a.group));actors=profiles.map(([variant,seed],i)=>{const a=createStudent({variant,seed,seated,mood:seated?'writing':'resting'});a.group.position.x=(i-2)*1.25;scene.add(a.group);return a});const teacher=createTeacher();teacher.group.position.x=2.6;scene.add(teacher.group);actors.push(teacher);const focus=document.querySelector('#focus');if(focus&&focus.onchange)focus.onchange({target:focus});const mood=document.querySelector('#mood');if(mood?.value!=='auto')actors.forEach(a=>a.setMood?.(mood.value))}make();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{angle=+b.dataset.view;document.querySelectorAll('[data-view]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)))});document.querySelector('#focus').onchange=e=>{const all=e.target.value==='all',i=all?0:+e.target.value,x=all?0:i===4?2.6:(i-2)*1.25;actors.forEach((a,j)=>a.group.visible=all||j===i);camera.position.set(x,all?2.1:1.25,all?8:2.7);camera.lookAt(x,all?1.04:1.15,0);document.querySelector('#labels').hidden=!all};document.querySelector('#mood').onchange=e=>actors.forEach(a=>a.setMood?.(e.target.value==='auto'?(seated?'writing':'resting'):e.target.value));document.querySelector('#pose').onclick=()=>{seated=!seated;make();document.querySelector('#pose').textContent=seated?'站姿':'坐姿'};function resize(){r.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function frame(t){requestAnimationFrame(frame);actors.forEach((a,i)=>{a.group.rotation.y=angle;a.update(t/1000,i===4?{walking:0,look:0,phase:'scan',alert:0}:1/60)});r.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
