<!doctype html><meta charset="utf-8"><title>新道具检查</title><style>body{margin:0;background:#e7efef;font:16px sans-serif}nav{position:fixed;top:12px;left:12px;display:flex;gap:8px}select,button{padding:8px}#info{position:fixed;bottom:12px;left:12px}canvas{display:block}</style><nav><select id="model" aria-label="模型"></select><select id="angle" aria-label="角度"><option value="0">正面</option><option value=".7854">斜侧</option><option value="1.5708">侧面</option><option value="3.14159">背面</option></select><select id="source" aria-label="版本"><option value="raw">原始</option><option value="runtime">游戏</option></select></nav><div id="info">加载中</div><script type="module">
import * as T from '../dist/vendor/three.module.js';import{GLTFLoader}from'../dist/vendor/addons/loaders/GLTFLoader.js';
const names=['phone','mouse','computer-tower','keyboard','gum','cabinet','lunch','pen','office-desk','office-chair','monitor'],sel=document.querySelector('#model'),angle=document.querySelector('#angle'),source=document.querySelector('#source'),info=document.querySelector('#info');for(const name of names){const op=document.createElement('option');op.value=op.textContent=name;sel.append(op);}sel.value=new URL(location.href).searchParams.get('model')||'phone';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e7efef');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.05,3.3);camera.lookAt(0,.55,0);scene.add(new T.HemisphereLight('#ffffff','#889cac',2.5));const key=new T.DirectionalLight('#fff7ed',3);key.position.set(-2,3,4);scene.add(key);scene.add(new T.GridHelper(2,10,'#8b9c9c','#c1cece'));const loader=new GLTFLoader();let current=null;
async function load(){if(current)scene.remove(current);info.textContent='加载中';try{const gltf=await loader.loadAsync(source.value==='raw'?'../art-source/tripo67/originals/'+sel.value+'.glb':'../dist/assets/models/'+sel.value+'-v67.glb');const root=gltf.scene,box=new T.Box3().setFromObject(root),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());let tris=0;root.traverse(o=>{if(o.isMesh)tris+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;});const fit=1.35/Math.max(...size.toArray());root.position.sub(center);root.position.y+=size.y/2;current=new T.Group();current.add(root);current.scale.setScalar(fit);current.rotation.y=+angle.value;scene.add(current);info.textContent=`${sel.value} · ${tris} 三角面 · ${size.toArray().map(n=>n.toFixed(4)).join(' × ')}`;document.body.dataset.ready=sel.value;}catch(e){info.textContent=e.message;}}sel.onchange=source.onchange=load;angle.onchange=()=>current.rotation.y=+angle.value;await load();function frame(){requestAnimationFrame(frame);renderer.render(scene,camera);}frame();
</script>
