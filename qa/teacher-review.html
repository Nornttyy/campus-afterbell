<!doctype html><html lang="zh"><meta charset="utf-8"><title>老师模型与动作检视</title>
<style>body{margin:0;background:#e4e9e8;color:#26343c;font:14px sans-serif}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}button,select{font:inherit;padding:10px 16px;border:1px solid #82918d;background:white;border-radius:5px;cursor:pointer}#status{position:fixed;top:12px;left:12px;background:#fffd;padding:8px}</style>
<canvas></canvas><div id="status"></div><nav><select aria-label="老师动作" id="action"><option value="idle">站立</option><option value="walk">走路</option><option value="write">写板书</option><option value="throw">掷粉笔</option><option value="grip">抓颈</option></select><button data-angle="0">正面</button><button data-angle=".7">斜侧</button><button data-angle="1.5708">侧面</button><button data-angle="3.1416">背面</button><button id="close">面部近景</button><button id="pause">暂停</button><button id="step">前进 0.1 秒</button></nav>
<script type="module">
import * as T from '../dist/vendor/three.module.js';import{createTeacher}from'../dist/game-actors.js?v=campus-75';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#e4e9e8');const camera=new T.PerspectiveCamera(33,1,.05,30);const actor=createTeacher();scene.add(actor.group);scene.add(new T.HemisphereLight('#f7faff','#b4a58f',1.3));const sun=new T.DirectionalLight('#fff4df',2.6);sun.position.set(-3,5,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new T.DirectionalLight('#eaf4ff',.8);fill.position.set(4,2,2);scene.add(fill);const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#d5dcd6',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let angle=0,time=1,paused=false,close=false,action='idle';function view(){camera.position.set(0,close?1.84:1.30,close?1.22:4.4);camera.lookAt(0,close?1.83:1.10,0);}view();document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=+b.dataset.angle;});document.querySelector('#action').onchange=e=>{action=e.target.value;};document.querySelector('#close').onclick=()=>{close=!close;view();};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停';};document.querySelector('#step').onclick=()=>{paused=true;time+=.1;document.querySelector('#pause').textContent='播放';};function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)time+=dt;actor.group.rotation.y=angle;actor.update(time,{walking:action==='walk'?1:0,look:0,phase:action==='write'?'board':'scan'});actor.group.updateMatrixWorld(true);if(action==='grip')actor.gripNeck(new T.Vector3(.10,1.34,.52).applyAxisAngle(new T.Vector3(0,1,0),angle));if(action==='throw')actor.castChalk((time%2.4)/2.4);renderer.render(scene,camera);document.querySelector('#status').textContent=`${action} · ${time.toFixed(2)} 秒`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
