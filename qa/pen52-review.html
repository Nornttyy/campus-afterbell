<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笔 · 实际教室检视</title>
<style>body{margin:0;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}nav{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;padding:10px;background:#fffE;z-index:2}button{padding:9px}output{font-variant-numeric:tabular-nums}label{display:flex;align-items:center;gap:4px}</style>
<canvas aria-label="正式教室和第一人称手"></canvas><nav><button id="take">拿起笔</button><button id="return">放回笔</button><button id="pause">暂停</button><label>低头<input id="pitch" type="range" min="0" max="1.3" value=".72" step=".01"></label><label>转头<input id="yaw" type="range" min="-1" max="1" value="0" step=".01"></label><output>加载中</output></nav>
<script type="module">
import{createClassroom}from'../dist/classroom.js?v=campus-74';import{ClassroomRound}from'../dist/classroom-rules.js?v=campus-74';
const out=document.querySelector('output'),canvas=document.querySelector('canvas');addEventListener('error',e=>out.textContent='ERROR '+e.message);addEventListener('unhandledrejection',e=>out.textContent='ERROR '+e.reason);
const scene=await createClassroom(canvas,{snapEntry:true}),round=new ClassroomRound({seed:0,target:10000});round.start();round._advanceTeacher=()=>{};round._perceive=()=>{};for(const s of round.students){s._decisionAt=Infinity;s._restUntil=Infinity;}round.setLook(0,.72);
document.querySelector('#take').onclick=()=>round.takePen();document.querySelector('#return').onclick=()=>round.returnItem();document.querySelector('#pause').onclick=e=>{round.pause(!round.paused);e.target.textContent=round.paused?'继续':'暂停';};const look=()=>round.setLook(Number(document.querySelector('#yaw').value),Number(document.querySelector('#pitch').value));document.querySelector('#pitch').oninput=look;document.querySelector('#yaw').oninput=look;
let last=performance.now();function frame(now){const s=round.step(Math.min(.05,(now-last)/1000));last=now;scene.setGameplay(s);out.textContent=`${s.player.penWriting?'循环写字':s.drawer.drawnSlot===null?'空手':'暂停'} · 捣蛋值 ${s.score} · ${s.elapsed.toFixed(1)}s`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
