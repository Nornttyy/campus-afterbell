<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手部动作检视</title>
<style>body{margin:0;background:#dde6e7;font:14px system-ui;color:#213b43}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#fffffff0;padding:10px;border:1px solid #c4d0d1;border-radius:6px;z-index:2}button,select{font:inherit;padding:8px 12px;border:1px solid #9eafb2;background:white;border-radius:4px;color:inherit}button[aria-pressed=true]{background:#276a83;color:white}button:disabled,select:disabled{opacity:.5}output{min-width:15em;font-variant-numeric:tabular-nums}label{display:flex;gap:5px;align-items:center;font-size:12px}#pitch{width:90px}progress{width:90px}footer{position:fixed;bottom:10px;left:12px;right:12px;font-size:12px;line-height:1.5;background:#ffffffe8;padding:8px;border-radius:5px}#error{color:#ab3434}</style>
<canvas aria-label="实际 hand-v3 模型"></canvas><nav>
<select id="item" aria-label="检视物品"><option value="snack">零食</option><option value="drink">饮料</option><option value="burger">汉堡</option><option value="phone">手机</option><option value="smoke">烟雾弹</option><option value="flash">闪光弹</option><option value="ink">墨水瓶</option></select>
<button id="hold" aria-pressed="false">拿起</button><button id="use" aria-pressed="false">使用</button><button id="throw">松手投掷</button><label id="progress-label">进度 <progress id="progress" max="1" value="0"></progress></label>
<button id="pause" aria-pressed="false">暂停</button><button id="step">前进一帧</button><button id="stand">站立</button><button id="walk" aria-pressed="false">行走</button><button id="crawl" aria-pressed="false">爬行</button><label>俯仰 <input id="pitch" type="range" min="-1.3" max="1.3" step=".01" value=".08"></label><label>转头 <input id="yaw" type="range" min="-1.5" max="1.5" step=".01" value="0"></label><button id="reset-view">默认视角</button><button id="record">录制3秒</button><output id="state">加载 hand-v3…</output>
</nav><footer>行走在走廊安全路径往返；坐下返回课桌。转头可检查坐姿双手是否保持在桌前。使用正式移动采样和独立手部渲染。<span id="error" role="alert"></span></footer>
<section id="recording-preview" hidden style="position:fixed;right:12px;bottom:65px;width:360px;max-width:80vw;background:white;padding:10px;z-index:3"><button id="close-recording">关闭回放</button><video id="recorded-video" controls playsinline loop style="display:block;width:100%"></video><a id="download-recording">下载视频</a></section>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {loadStudentAssets} from '../dist/student-assets.js?v=campus-59c';
import {loadDeskModel} from '../dist/imported-actors.js?v=campus-59c';
import {loadPropAssets,CLASSROOM_PROP_SOURCES} from '../dist/prop-assets.js?v=campus-59c';
import {createDeskHands,THROWABLE_ITEM_KINDS} from '../dist/game-actors.js?v=campus-59c';
import {ClassroomRound,CLASSROOM_ACTIONS} from '../dist/classroom-rules.js?v=campus-59c';
import {createFirstPersonView,sampleFirstPersonMotion} from '../dist/first-person-view.js?v=campus-59c';
import {CRAWL_TUNING} from '../dist/crawl-profile.js?v=campus-59c';
import {SEATS,PLAYER_SEAT} from '../dist/classroom-layout.js?v=campus-59c';
const ui=Object.fromEntries(['item','hold','use','throw','progress','progress-label','pause','step','stand','walk','crawl','pitch','yaw','reset-view','record','recording-preview','recorded-video','download-recording','close-recording','state','error'].map(id=>[id,document.getElementById(id)]));
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#dde6e7');scene.add(new T.HemisphereLight('#edf5ff','#dce3e3',2.5));
const sun=new T.DirectionalLight('#fff8ed',4);sun.position.set(-9.7,6.6,3.2);sun.target.position.set(1,.2,-3.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:35});sun.shadow.bias=-.00015;sun.shadow.normalBias=.012;sun.shadow.radius=2.2;sun.shadow.intensity=.92;scene.add(sun,sun.target);
const fill=new T.DirectionalLight('#e5eef4',.85);fill.position.set(5,4,6);scene.add(fill);const teachingFill=new T.DirectionalLight('#f1f4ff',.65);teachingFill.position.set(0,3,-3);teachingFill.target.position.set(0,2.25,5.3);scene.add(teachingFill,teachingFill.target);
const camera=new T.PerspectiveCamera(62,1,.08,70);scene.add(camera);
let assets,desk;try{[assets,desk]=await Promise.all([loadStudentAssets(),loadDeskModel(),loadPropAssets(CLASSROOM_PROP_SOURCES)]);}catch(error){ui.error.textContent=error.message;throw error;}
const hands=createDeskHands({createHand:assets.createHand}),firstPersonView=createFirstPersonView(renderer,camera,[hands.group]);canvas.dataset.palmAssets='hand-left-v3,hand-right-v3';
const seat=SEATS[PLAYER_SEAT],deskBody=desk.body.clone(true),deskDrawer=desk.drawer.clone(true);deskBody.position.set(seat.deskX,0,seat.deskZ);deskDrawer.position.set(seat.deskX,0,seat.deskZ);scene.add(deskBody,deskDrawer);
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#d6dbd3',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new T.GridHelper(40,40,'#8caaa6','#b8c8c2');grid.position.y=.002;scene.add(grid);
// Only the QA fixture selects deterministic inventory and keeps observers idle.
// Taking, returning, progress, consumption/refill and release use the real round.
const round=new ClassroomRound({target:100000});round.start();round._thinkAt=Infinity;round.teacher.viewRange=0;
for(const student of round.students)if(!student.isPlayer){student._decisionAt=Infinity;student._idleAt=Infinity;student._restUntil=Infinity;}
round.toggleDrawer();let snapshot=round.snapshot(),time=0,paused=false,last=0,pending=null,finishedAt=-Infinity,drawerOpen=0,walking=false,walkDirection=1,firstPersonMotion=null,eyeHeight=null,lastViewTime=0;
function installItem(action,take=false){const p=round.player;if(p._drawnSlot!==null)throw new Error('必须先放回旧物品');p._slots[0]={id:0,action,readyAt:0,progress:0};p.progress=0;round.selectSlot(0);if(take){if(!p._drawerOpen)round.toggleDrawer();round.takeSlot(0);}snapshot=round.snapshot();ui.item.value=action;}
installItem(ui.item.value);
function switchItem(action){if(!CLASSROOM_ACTIONS[action])return;const carrying=round.player._drawnSlot!==null;round.hold(false);if(carrying&&!round.returnItem()){ui.error.textContent='请先坐下再换物品';ui.item.value=snapshot.selected;return;}pending={action,take:carrying};finishedAt=-Infinity;snapshot=round.snapshot();render();}
function carrying(){return snapshot.drawer.drawnSlot!==null;}
ui.hold.onclick=()=>{if(pending)return;round.hold(false);if(carrying())round.returnItem();else{if(!round.player._drawerOpen)round.toggleDrawer();round.takeSlot(0);}finishedAt=-Infinity;snapshot=round.snapshot();render();};
ui.use.onclick=()=>{if(pending||!carrying())return;round.hold(!snapshot.holding);finishedAt=-Infinity;snapshot=round.snapshot();render();};
ui.throw.onclick=()=>{if(!THROWABLE_ITEM_KINDS.includes(snapshot.selected)||!carrying())return;if(!snapshot.holding)round.hold(true);round.releaseUse();finishedAt=time;snapshot=round.snapshot();render();};
ui.item.onchange=event=>switchItem(event.target.value);
ui.pause.onclick=()=>{paused=!paused;render();};
ui.step.onclick=()=>{paused=true;advance(1/60);render();};
ui.stand.onclick=()=>{round.hold(false);walking=false;round.setMovement(0,0);round.setCrouch(false);if(!round.player.seated)Object.assign(round.player,{x:seat.x,z:seat.z});round.interact();firstPersonMotion=null;snapshot=round.snapshot();render();};
ui.walk.onclick=()=>{walking=!walking;if(walking){if(round.player.seated)round.interact();Object.assign(round.player,{x:7,z:0});firstPersonMotion=null;walkDirection=1;}else round.setMovement(0,0);snapshot=round.snapshot();render();};
ui.crawl.onclick=()=>{round.setCrouch(!round.player.crouched);snapshot=round.snapshot();render();};
function look(){round.setLook(Number(ui.yaw.value),Number(ui.pitch.value));snapshot=round.snapshot();render();}
ui.pitch.oninput=look;ui.yaw.oninput=look;
ui['reset-view'].onclick=()=>{ui.pitch.value='.08';ui.yaw.value='0';look();};round.setLook(0,.08);snapshot=round.snapshot();
function advance(dt){
 if(walking){if(round.player.z>3.5)walkDirection=-1;else if(round.player.z< -3.5)walkDirection=1;round.setMovement(0,walkDirection);}else round.setMovement(0,0);
 time+=dt;snapshot=round.step(dt);
 for(const event of round.drainEvents())if(event.type==='complete'&&event.actor==='player')finishedAt=time;
 // Observe the production viewmodel's complete retraction before replacing slots.
 if(pending&&hands.getDebug().extension<=.001){const queued=pending;pending=null;installItem(queued.action,queued.take);}
 drawerOpen=T.MathUtils.damp(drawerOpen,snapshot.drawer.open?1:0,snapshot.drawer.open?12:18,dt);deskDrawer.position.z=seat.deskZ-drawerOpen*.24;
}
function render(){
 const player=snapshot.player,seated=player.seated!==false,pitch=player.pitch??.08;
 const dt=Math.max(0,time-lastViewTime);lastViewTime=time;firstPersonMotion=sampleFirstPersonMotion(firstPersonMotion,player,time);
 hands.update(time,{action:snapshot.selected,holding:Boolean(snapshot.holding&&!player.caught),carrying:snapshot.drawer.drawnSlot!==null&&!player.caught,progress:snapshot.actionProgress,alert:0,seated,crouched:player.crouched,caught:player.caught,freeLook:true,viewPitch:pitch,computer:player.computerActive,typing:snapshot.holding,throwAge:player.itemThrowAge??Infinity,movement:firstPersonMotion.amount,walkPhase:firstPersonMotion.phase,crawlBlend:firstPersonMotion.crawlBlend});
 const desiredHeight=seated?1.43:player.crouched?CRAWL_TUNING.eyeHeight:1.65;eyeHeight=eyeHeight===null?desiredHeight:T.MathUtils.damp(eyeHeight,desiredHeight,13,dt);
 camera.position.set(player.x,eyeHeight,player.z);camera.rotation.set(-T.MathUtils.clamp(pitch,-1.4,1.4),(player.yaw||0)+Math.PI,0,'YXZ');camera.updateMatrixWorld(true);firstPersonView.align(player,firstPersonMotion,camera.position);
 const state=hands.getDebug(),inHand=carrying(),throwable=THROWABLE_ITEM_KINDS.includes(snapshot.selected),refill=snapshot.drawer.slots[0].readyIn;
 ui.hold.textContent=inHand?'放回':'拿起';ui.hold.disabled=Boolean(pending)||!seated||!inHand&&(state.extension>.001||!snapshot.drawer.slots[0].action);ui.hold.setAttribute('aria-pressed',String(inHand));
 ui.use.textContent=snapshot.holding?(throwable?'取消蓄力':'停止使用'):(throwable?'蓄力':'使用');ui.use.disabled=Boolean(pending)||!inHand||!seated&&!throwable;ui.use.setAttribute('aria-pressed',String(snapshot.holding));
 ui.throw.hidden=!throwable;ui.throw.disabled=Boolean(pending)||!inHand;ui.progress.value=snapshot.actionProgress;ui['progress-label'].firstChild.textContent=throwable?'蓄力 ':'进度 ';
 ui.pause.textContent=paused?'继续':'暂停';ui.pause.setAttribute('aria-pressed',String(paused));ui.stand.textContent=seated?'站立':'坐下';ui.stand.disabled=Boolean(pending);ui.item.disabled=Boolean(pending)||!seated;
 ui.walk.textContent=walking?'停下':'行走';ui.walk.setAttribute('aria-pressed',String(walking));ui.walk.disabled=Boolean(pending);ui.crawl.disabled=seated;ui.crawl.setAttribute('aria-pressed',String(player.crouched));
 if(!pending&&document.activeElement!==ui.item&&snapshot.drawer.slots[0].action)ui.item.value=snapshot.selected;
 const phase=pending?'放回后换物':snapshot.holding?(throwable?'蓄力中':'使用中'):inHand?(state.extension<.99?'拿取中':'仅拿着'):state.extension>.001?(time-finishedAt<1?'使用完成 · 退场':'放回中'):refill>0?'使用完成 · 等待刷新':'空手';
 ui.state.textContent=`${time.toFixed(2)}s · ${phase} · ${player.crouched?'爬行':walking?'行走':seated?'坐姿':'站立'} · ${firstPersonMotion.speed.toFixed(2)}m/s`;
 canvas.dataset.phase=String(state.extension);canvas.dataset.active=state.active;canvas.dataset.visible=String(state.visible);canvas.dataset.ready=String(state.extension>=.99&&inHand);canvas.dataset.carrying=String(inHand);canvas.dataset.using=String(snapshot.holding);canvas.dataset.pending=pending?.action||'';canvas.dataset.handState=JSON.stringify({...state,time,selected:snapshot.selected,progress:snapshot.actionProgress,seated,cameraPitch:pitch,cameraYaw:player.yaw,completed:snapshot.completed,cameraFov:camera.fov,walking,position:{x:player.x,z:player.z},motion:firstPersonMotion});
 renderer.render(scene,camera);firstPersonView.render();
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<.9?69:62;camera.updateProjectionMatrix();render();}
addEventListener('resize',resize);addEventListener('blur',()=>{walking=false;round.setMovement(0,0);round.setCrouch(false);round.hold(false);snapshot=round.snapshot();render();});resize();
function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.08):1/60;last=now;if(!paused)advance(dt);render();}requestAnimationFrame(frame);
let recordingUrl=null;
ui.record.disabled=typeof MediaRecorder==='undefined'||!canvas.captureStream;
ui.record.onclick=()=>{const mime=['video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)return;const stream=canvas.captureStream(60),recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}),chunks=[];ui.record.disabled=true;ui.record.textContent='录制中…';ui['recording-preview'].hidden=true;paused=false;
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(new Blob(chunks,{type:mime}));ui['recorded-video'].src=recordingUrl;ui['download-recording'].href=recordingUrl;ui['download-recording'].download=`hands-${round.player.crouched?'crawl':walking?'walk':'idle'}-hands48.${mime.includes('mp4')?'mp4':'webm'}`;ui['recording-preview'].hidden=false;ui.record.disabled=false;ui.record.textContent='录制3秒';};recorder.start();setTimeout(()=>recorder.stop(),3000);};
ui['close-recording'].onclick=()=>{ui['recorded-video'].pause();ui['recording-preview'].hidden=true;};
window.handsReview={round,hands,renderer,camera,firstPersonView,get snapshot(){return snapshot},get paused(){return paused},get motion(){return firstPersonMotion},step(){paused=true;advance(1/60);render();},switchItem};
</script></html>
