<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版动作连续片段对照</title>
<style>body{margin:0;background:#e8eeef;color:#233238;font:16px system-ui}header{padding:16px 24px;background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}select,button,a{font:inherit;padding:9px 13px;border:1px solid #adbbbf;background:white;color:inherit;border-radius:7px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}article{background:white;border-radius:12px;overflow:hidden}h2{font-size:16px;padding:0 16px}video{display:block;width:100%;background:#111;aspect-ratio:16/9}iframe{border:0;width:100%;height:620px}p{padding:0 16px;font-size:13px;color:#5d6b72}#source{font-size:13px} @media(max-width:900px){main{grid-template-columns:1fr}}</style>
<header><h1>动作连续片段</h1><select id="clip" aria-label="原版动作片段"></select><select id="speed" aria-label="播放速度"><option value="1">原速 1×</option><option value="0.5">半速 0.5×</option></select><button id="replay">从头播放</button><a href="./characters40-review.html?v=characters-40" target="_blank">单独打开模型检查</a></header>
<main><article><h2>原版视频片段</h2><video id="sourceVideo" controls loop playsinline preload="metadata"></video><p id="source"></p><p>保留连续画面和原速度，用于比较起势、动作节奏与收势。此页只供本地研究，不随游戏发布。</p></article><article><h2>当前游戏模型</h2><iframe src="./characters40-review.html?v=characters-40" title="当前游戏角色动作"></iframe></article></main>
<script>
const clips=[['01-throw-chalk-25m33s','抛粉笔','25:33—25:41'],['02-catch-carry-bind-26m04s','抓起、运送、绑住','26:04—26:18'],['03-walk-write-30m54s','走近黑板、板书','30:54—31:08'],['04-drawer-use-33m14s','开抽屉、取物、使用、收手','33:14—33:28'],['05-bound-bubble-35m30s','被绑、吹气','35:30—35:48'],['06-student-look-sit-00m48s','学生转身、俯视、入座','00:48—01:02'],['07-student-office-look-34m14s','学生办公室俯视、平视与双手','34:14—34:32']];
const select=document.querySelector('#clip'),video=document.querySelector('video');
clips.forEach(([file,label],index)=>select.add(new Option(label,index)));
function choose(){const[file,label,range]=clips[select.value||0];video.src='../docs/reference-media/motion-clips40/'+file+'.mp4';document.querySelector('#source').textContent='BV1Knnk6HEic · '+range+' · '+label;video.playbackRate=Number(document.querySelector('#speed').value)}
select.onchange=()=>{choose();video.play().catch(()=>{})};document.querySelector('#speed').onchange=e=>video.playbackRate=Number(e.target.value);document.querySelector('#replay').onclick=()=>{video.currentTime=0;video.play().catch(()=>{})};choose();
</script></html>
