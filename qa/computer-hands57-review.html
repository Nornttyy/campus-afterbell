<!doctype html><meta charset="utf-8"><title>机房双手键盘动作检视</title><style>body{margin:0;background:#dfe8e8;font:14px system-ui}nav{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;padding:8px}output{position:absolute;bottom:12px;left:12px;background:#fff9;padding:8px;white-space:pre-wrap}</style>
<nav><select id="model"><option value="boy">男同学</option><option value="girl">紫发同学</option><option value="glasses">眼镜同学</option><option value="ponytail">马尾同学</option></select><select id="pose"><option value="resting">放松</option><option value="listening">看老师</option><option value="reading">双手捧书</option><option value="computer-idle">机房桌边休息</option><option value="writing">写字</option><option value="pen">拿笔写字</option><option value="twirl">平转笔</option><option value="computer" selected>双手键盘</option><option value="phone">手机</option><option value="thinking">思考</option><option value="snack">零食</option><option value="drink">饮料</option><option value="banana">香蕉</option><option value="burger">汉堡</option><option value="cycle">连续切换</option></select><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="three">斜侧</button><button data-view="back">背面</button><button id="reverse">反向座位</button><button id="pause">暂停</button><button id="step">前进1帧</button><button id="replay">重新过渡</button></nav><output id="status">加载中</output>
<script type="module">
import {createRoomVariants} from '../dist/room-variants.js?v=campus-68b';import * as T from '../dist/vendor/three.module.js';import {loadStudentAssets} from '../dist/student-assets.js?v=campus-68b';import {loadDeskModel} from '../dist/imported-actors.js';import {createDeskItem} from '../dist/game-actors.js?v=campus-68b';import {loadPropAssets,CLASSROOM_PROP_SOURCES} from '../dist/prop-assets.js?v=campus-68b';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1.08;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dfe8e8');scene.add(new T.HemisphereLight('#edf5ff','#dce3e3',2.5));const sun=new T.DirectionalLight('#fff8ed',4);sun.position.set(-4,6,4);scene.add(sun);const camera=new T.PerspectiveCamera(37,1,.01,30),pivot=new T.Group();scene.add(pivot);const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:'#c8d3cc'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);
const [assets,desk]=await Promise.all([loadStudentAssets(),loadDeskModel(),loadPropAssets(CLASSROOM_PROP_SOURCES)]);const furniture=new T.Group();pivot.add(furniture);for(const part of [desk.body,desk.drawer]){part.position.z+=.78;furniture.add(part);}furniture.add(desk.chair);
// Same open-book dimensions, hinge angle and placement as the shipping desk.
const book=new T.Group();book.position.set(0,.88,.5);book.rotation.x=Math.PI/2;furniture.add(book);for(const side of [-1,1]){const leaf=new T.Group();leaf.rotation.y=side*.14;book.add(leaf);const page=new T.Mesh(new T.BoxGeometry(.335,.45,.008),new T.MeshStandardMaterial({color:'#faf8ef'}));page.position.set(side*.1675,.225,0);leaf.add(page);}
const mat=(color,options={})=>new T.MeshStandardMaterial({color,...options}),box=(material,p,size,rotation,parent)=>{const mesh=new T.Mesh(new T.BoxGeometry(...size),material);mesh.position.fromArray(p);if(rotation)mesh.rotation.fromArray(rotation);parent.add(mesh);return mesh;},rounded=(material,p,size,r,rotation,parent)=>box(material,p,size,rotation,parent);
const lab=createRoomVariants({scene:pivot,box,rounded,mat,texture:()=>null,bakeStatic:()=>{}});lab.setSeats([{id:0,deskX:0,deskZ:.78,x:0,z:0,yaw:0}]);lab.setMap('computer');
let actor,props={},time=0,last=performance.now(),paused=false,view='three',reverse=false,chosen='computer',transition=0;
const ui=Object.fromEntries(['model','pose','pause','step','replay','status','reverse'].map(k=>[k,document.getElementById(k)]));
function choose(){if(actor){pivot.remove(actor.group);actor.dispose();}actor=assets.createStudent({variant:ui.model.value,seated:true});pivot.add(actor.group);actor.setStudyBook(book);props={};for(const kind of ['phone']){const anchor=actor.getHand(kind==='phone'?'left':'right'),fit=anchor.userData.attachments[kind],prop=createDeskItem(kind);prop.position.fromArray(fit.position);prop.rotation.fromArray(fit.rotation);anchor.add(prop);props[kind]=prop;}time=0;transition=0;actor.setMood('resting');for(let i=0;i<120;i++)actor.update(time+=1/60);}
function tick(dt){time+=dt;transition+=dt;chosen=ui.pose.value==='cycle'?['resting','phone','thinking','drink','banana','writing'][Math.floor(transition/3)%6]:ui.pose.value;const computer=chosen.startsWith('computer');lab.setMap(computer?'computer':'classroom');desk.body.visible=desk.drawer.visible=book.visible=!computer;actor.setMood(chosen);actor.setMotion({seated:true,carrying:['pen','twirl','phone','snack','drink','banana','burger'].includes(chosen),using:chosen!=='pen',penWriting:chosen==='pen',penTwirling:chosen==='twirl',heldAction:chosen==='twirl'?'pen':['pen','drink','banana','burger','snack','phone'].includes(chosen)?chosen:null,speed:0});actor.update(time);book.visible=!computer&&!actor.studyBookVisible();for(const [kind,p]of Object.entries(props))p.visible=chosen===kind;}
ui.model.onchange=choose;ui.pose.onchange=()=>transition=0;ui.replay.onclick=choose;ui.pause.onclick=()=>{paused=!paused;ui.pause.textContent=paused?'播放':'暂停';};ui.step.onclick=()=>{paused=true;ui.pause.textContent='播放';tick(1/60);};ui.reverse.onclick=()=>{reverse=!reverse;ui.reverse.textContent=reverse?'恢复座位方向':'反向座位';};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view=b.dataset.view);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();choose();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)tick(dt);pivot.rotation.y=reverse?Math.PI:0;const positions={front:[0,1.12,2.5],side:[2.35,.98,.25],three:[1.8,1.16,2],back:[0,1.1,-2.5]};camera.position.fromArray(positions[view]);camera.lookAt(0,.88,.25);renderer.render(scene,camera);ui.status.textContent=`${ui.model.value} · ${chosen} · ${time.toFixed(2)}s\n生产机房桌心在角色前 0.78m，键帽高0.901m；真实Tripo人物/椅子 · ${reverse?'反向座位':'正向座位'}`;}
window.computerHands57={get actor(){return actor},choose(variant){ui.model.value=variant;choose()},setPose(pose){ui.pose.value=pose},setView(next){view=next}};requestAnimationFrame(frame);
</script>
