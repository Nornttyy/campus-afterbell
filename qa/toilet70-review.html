<!doctype html><html lang="zh"><meta charset="utf-8"><title>厕所场景核对</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e4e7e1;font:14px system-ui}canvas{display:block;width:100%;height:100%}nav{position:absolute;left:12px;top:12px;display:flex;gap:7px;align-items:center;padding:8px;background:#fffde9ed;border-radius:5px}button{padding:7px 10px;border:1px solid #c6c8be;background:#fffff5;cursor:pointer}output{font-size:12px}</style><canvas></canvas><nav><button data-view="front">全景</button><button data-view="stall">隔间</button><button data-view="cabinet">木柜</button><button data-view="top">布局</button><button id="doors">开隔间门</button><button id="cabinets">开柜子</button><output>12 个独立隔间 · 重建容量</output></nav>
<script type="module">
import * as T from '../dist/vendor/three.module.js';import {OrbitControls} from '../dist/vendor/addons/controls/OrbitControls.js';import {createToiletRoom,TOILET_STALLS} from '../dist/toilet-room70.js';import {hotpotHelpers} from './hotpot70-helpers.mjs';
const scene=new T.Scene();scene.background=new T.Color('#e5e9e3');const camera=new T.PerspectiveCamera(64,innerWidth/innerHeight,.05,100),renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const h=hotpotHelpers(scene,{textureDraw:true}),room=createToiletRoom(h);scene.add(new T.HemisphereLight('#ecf5ff','#b7ac98',2.6));const sun=new T.DirectionalLight('#fff2d9',3.1);sun.position.set(-10,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:45});sun.shadow.normalBias=.02;scene.add(sun);const fill=new T.DirectionalLight('#e9f2ee',1.4);fill.position.set(6,5,4);scene.add(fill);
const cream=h.mat('#eae8d8'),trim=h.mat('#567e78');h.box(h.mat('#b8c1bb'),[.275,-.07,-.6],[13.85,.14,18.8]);h.box(cream,[-6.72,1.8,-.6],[.1,3.6,18.8]);h.box(cream,[.275,1.8,-10.05],[13.85,3.6,.1]);h.box(cream,[.275,1.8,8.85],[13.85,3.6,.1]);h.box(h.mat('#204c3d'),[.25,2.12,8.76],[7.3,1.5,.035]);h.box(trim,[.25,1.35,8.74],[7.48,.055,.09]);
const paleGlass=h.mat('#b8d4d5',{roughness:.3});for(let x=-5.2;x<6;x+=2.6){h.box(trim,[x,2.83,-9.98],[1.65,.63,.055]);h.box(paleGlass,[x,2.83,-9.94],[1.50,.49,.025]);}
// Unbranded dummy packages are QA shelf markers only, never production loot.
for(const [id,cab]of room.cabinets){for(let i=0;i<2;i++){const root=new T.Group();cab.foodAnchors[i].add(root);h.rounded(h.mat(i?'#c85840':'#dcbd4b'),[0,.08,0],[.25,.14,.18],.018,null,root);}}
let openDoors=false,openCabinets=false;const state={toiletDoors:{},toiletCabinets:{},students:[{seated:true,seatId:0}]};const sync=()=>{for(const s of TOILET_STALLS){state.toiletDoors[s.id]=openDoors;state.toiletCabinets[s.id]=openCabinets;}};document.querySelector('#doors').onclick=()=>{openDoors=!openDoors;sync();};document.querySelector('#cabinets').onclick=()=>{openCabinets=!openCabinets;sync();};
const views={front:[[5.9,2.15,5.7],[-.3,1.0,-3.8]],stall:[[.97,1.40,3.58],[.85,.7,.40]],cabinet:[[1.1,1.08,2.2],[1.83,.65,.33]],top:[[.2,19,-1.2],[.2,0,-1.2]]};function setView(key){if(key==='stall'||key==='cabinet'){openDoors=true;openCabinets=true;sync();for(let i=0;i<90;i++)room.update(state,.016);}camera.position.set(...views[key][0]);controls.target.set(...views[key][1]);controls.update();}setView(new URLSearchParams(location.search).get('view')||'front');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));let last=0;renderer.setAnimationLoop(t=>{const dt=last?Math.min(.1,(t-last)/1000):0;last=t;room.update(state,dt);controls.update();renderer.render(scene,camera);});onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};window.toiletReview={room,scene,camera,renderer,state,setView};
</script></html>
