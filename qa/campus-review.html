<!doctype html><meta charset="utf-8"><title>校园连接检查</title><style>html,body{margin:0;background:#111;color:white;font:14px sans-serif}canvas{width:100vw;height:calc(100vh - 42px);display:block}nav{height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;overflow-x:auto;white-space:nowrap}button,select{font:inherit;flex-shrink:0}#note{margin-left:auto}</style>
<nav><select id="map"><option value="classroom">白天教室</option><option value="night">夜间教室</option><option value="tiered">阶梯教室</option><option value="computer">机房</option><option value="hotpot">火锅教室</option><option value="toilet">厕所教室</option><option value="dorm">宿舍查寝</option><option value="playground">操场</option></select><select id="quality" aria-label="画质"><option value="high">精致</option><option value="low">流畅</option></select><button id="office">办公室</button><button id="officeInside">办公室内</button><button id="corridor">走廊</button><button id="courtyard">窗外庭院</button><button id="front">教室前方</button><button id="angle">教室斜看</button><button id="rear">教室后方</button><button id="lift">电梯</button><button id="walk">走完整条路线</button><span id="note">加载中</span></nav><canvas id="canvas"></canvas>
<script type="module">
import {createClassroom} from '../dist/classroom.js?v=campus-81';
import {TeacherRound} from '../dist/teacher-rules.js?v=campus-81';
import {walkRoute,floorHeight,blocked,TEACHER_SPAWN} from '../dist/classroom-layout.js?v=campus-81';
const canvas=document.querySelector('#canvas'),scene=await createClassroom(canvas,{renderDevice:new URL(location.href).searchParams.get('device')||'auto'}),select=document.querySelector('#map'),note=document.querySelector('#note');
let map=new URL(location.href).searchParams.get('map')||'tiered',round,route=[],last=0,trace=[],keys=new Set();select.value=map;
function reset(){round=new TeacherRound({map,target:100000});round.start();for(const s of round.students)s._decisionAt=Infinity;route=[];trace=[];scene.setMap(map);scene.setGameplay(round.snapshot());}
function place(x,z,yaw,pitch=0){route=[];Object.assign(round.player,{x,z,yaw,pitch});round.setLook(yaw,pitch);scene.setGameplay(round.snapshot());}
reset();
const quality=document.querySelector('#quality');quality.value=new URL(location.href).searchParams.get('device')==='mobile'?'low':'high';scene.setQuality(quality.value);quality.onchange=()=>scene.setQuality(quality.value);
document.querySelector('#office').onclick=()=>place(9.2,8.3,0,0);
document.querySelector('#officeInside').onclick=()=>place(6.70,9.60,-Math.PI/2,0);
document.querySelector('#corridor').onclick=()=>place(9.8,4.80,Math.PI,0);
document.querySelector('#courtyard').onclick=()=>place(-5.25,-2.17,-Math.PI/2,.12);
document.querySelector('#front').onclick=()=>place(1.58,4.30,Math.PI,0);
document.querySelector('#angle').onclick=()=>place(1.15,5.55,Math.PI,.04);
document.querySelector('#rear').onclick=()=>place(1.58,-5.45,0,.15);
document.querySelector('#lift').onclick=()=>place(9.35,-16.5,Math.PI,.05);
select.onchange=()=>{map=select.value;reset();};
const details=document.createElement('select');details.setAttribute('aria-label','材质近看');details.id='details';
details.innerHTML='<option value="">材质近看</option><option value="notice">公告栏</option><option value="board">黑板槽</option><option value="window">窗框窗台</option><option value="desk">桌边与地面</option>';
document.querySelector('nav').insertBefore(details,note);
details.onchange=()=>{const views={notice:[-3.35,-8.8,-2.25,-.20],board:[0,-8.35,Math.PI,-.15],window:[-4.6,-2.17,-Math.PI/2,.15],desk:[-.80,5.25,-2.32,.60]};const view=views[details.value];if(view)place(...view);};
const outdoorView=document.createElement('button');outdoorView.textContent='操场跑道';document.querySelector('nav').insertBefore(outdoorView,note);outdoorView.onclick=()=>place(3.5,-16,0,.08);
function startRoute(){place(TEACHER_SPAWN.x,TEACHER_SPAWN.z,TEACHER_SPAWN.yaw,TEACHER_SPAWN.pitch);let point={x:TEACHER_SPAWN.x,z:TEACHER_SPAWN.z};route=[];for(const end of (map==='playground'?[{x:9.2,z:7},{x:6.3,z:7},{x:3.4,z:-38},{x:-10.8,z:-45},{x:-25,z:-21},{x:-10.8,z:-7},{x:6.3,z:7},{x:9.2,z:7}]:[{x:9.2,z:9.6},{x:9.2,z:7},{x:6.5,z:7},{x:1.15,z:5.55},{x:1.15,z:-8.25},{x:6.65,z:-8},{x:9.8,z:-8},{x:9.35,z:-19.22}])){const part=walkRoute(point,end,.20,round.layout);if(!part.length)throw Error('No route '+JSON.stringify({point,end}));route.push(...part);point=end;}trace=[];}
document.querySelector('#walk').onclick=startRoute;
window.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&!e.repeat&&scene.getInteraction()?.kind==='lift'&&!scene.getInteraction().current){map=scene.getInteraction().map;select.value=map;reset();place(7.15,-8.05,0,0);}});window.addEventListener('keyup',e=>keys.delete(e.code));canvas.onclick=()=>canvas.requestPointerLock?.();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas)round.setLook(round.player.yaw-e.movementX*.0024,Math.max(-1.2,Math.min(1.2,round.player.pitch+e.movementY*.0021)));});
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;const p=round.player;if(route.length){round.teacher.stamina=100;const target=route[0],dx=target.x-p.x,dz=target.z-p.z,d=Math.hypot(dx,dz);if(d<.06)route.shift();round.setMovement(dx/Math.max(d,.001),dz/Math.max(d,.001));round.setLook(Math.atan2(dx,dz),.02);}else{const f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),s=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);round.setMovement(Math.sin(p.yaw)*f-Math.cos(p.yaw)*s,Math.cos(p.yaw)*f+Math.sin(p.yaw)*s);}round.step(dt);scene.setGameplay(round.snapshot());const h=floorHeight(p.x,p.z,map);trace.push({x:p.x,z:p.z,h,blocked:blocked(p.x,p.z,.18,round.layout)});if(trace.length>10000)trace.shift();canvas.dataset.routeRemaining=String(route.length);canvas.dataset.routeBlocked=String(trace.filter(p=>p.blocked).length);note.textContent=`${map}  x ${p.x.toFixed(2)}  z ${p.z.toFixed(2)}  地面 ${h.toFixed(2)}  剩余路线 ${route.length}  ${scene.getInteraction()?.kind==='lift'?('E '+scene.getInteraction().map):''}`;requestAnimationFrame(frame);}
window.qaCampus={get round(){return round;},get trace(){return trace;},get remaining(){return route.length;},scene,place,startRoute,setMap(value){map=value;select.value=value;reset();}};requestAnimationFrame(frame);
</script>
