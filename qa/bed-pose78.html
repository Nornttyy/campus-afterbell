<!doctype html><meta charset="utf-8"><title>睡姿实机核对</title><style>body{margin:0;background:#202c2b;font:14px sans-serif}canvas{display:block;width:100vw;height:100vh}nav{position:absolute;top:10px;left:10px;padding:8px;background:#fffde9;display:flex;gap:8px}button,select{padding:8px}output{padding:8px}</style><canvas></canvas><nav><select id="variant"><option value="boy">男同学</option><option value="girl">紫发女生</option><option value="ponytail">棕发女生</option><option value="glasses">眼镜同学</option></select><button id="pose">睁眼 / 闭眼</button><button id="upper">上铺 / 下铺</button><button id="quilt">被子显示 / 隐藏</button><button id="angle">侧面 / 床尾</button><output>加载模型</output></nav>
<script type="module">
import * as T from '../dist/vendor/three.module.js';
import {OrbitControls} from '../dist/vendor/addons/controls/OrbitControls.js';
import {GLTFLoader} from '../dist/vendor/addons/loaders/GLTFLoader.js';
import {createRiggedStudent,STUDENT_ASSETS} from '../dist/student-assets.js?v=campus-83';
import {createDormRoom,DORM_BEDS,dormPoint,dormBodyOffset} from '../dist/dorm-room70.js?v=campus-83';
import {hotpotHelpers} from './hotpot70-helpers.mjs';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(56,innerWidth/innerHeight,.03,100),renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;scene.background=new T.Color('#455052');scene.add(new T.HemisphereLight('#e5f1f5','#988b76',2.1));const sun=new T.DirectionalLight('#ffefdb',2.2);sun.position.set(4,6,-5);scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const room=createDormRoom(hotpotHelpers(scene,{textureDraw:true})),actors=new Map();let variant='boy',upper=false,sleeping=true,angle=false;
for(const[v,a]of Object.entries(STUDENT_ASSETS)){const actor=createRiggedStudent(await new GLTFLoader().loadAsync('../dist/assets/models/'+a.file+'.glb'),{variant:v,seated:false});const pivot=new T.Group();pivot.add(actor.group);scene.add(pivot);actors.set(v,{actor,pivot});}
function view(){const bed=DORM_BEDS[upper?1:0],p=dormPoint({x:bed.lieX,z:bed.lieZ,yaw:bed.bunkYaw},angle?1.6:0,angle?1.1:2.2);camera.position.set(p.x,bed.supportHeight+1.02,p.z);controls.target.set(bed.lieX,bed.supportHeight+.36,bed.lieZ);controls.update();}
let quiltShown=true;document.querySelector('#quilt').onclick=()=>{quiltShown=!quiltShown;room.group.traverse(o=>{if(o.name.startsWith('dorm-plaid-blanket-'))o.visible=quiltShown;});};document.querySelector('#variant').onchange=e=>variant=e.target.value;document.querySelector('#pose').onclick=()=>sleeping=!sleeping;document.querySelector('#upper').onclick=()=>{upper=!upper;view();};document.querySelector('#angle').onclick=()=>{angle=!angle;view();};view();let last=0;renderer.setAnimationLoop(ms=>{const t=ms/1000,dt=Math.min(.05,t-last);last=t;const b=DORM_BEDS[upper?1:0],o=dormBodyOffset(b.lieYaw,true,variant);for(const[v,{actor,pivot}]of actors){pivot.visible=v===variant;if(!pivot.visible)continue;pivot.position.set(b.lieX+o.x,b.supportHeight+o.y,b.lieZ+o.z);pivot.rotation.set(o.pitch||0,b.lieYaw,o.roll,'YXZ');actor.setMood('resting');actor.setMotion({onBed:true,lying:true,sleeping,seated:false,speed:0});actor.update(t);document.querySelector('output').textContent=(sleeping?'闭眼侧躺':'清醒侧躺')+' · '+(upper?'上铺':'下铺');}room.update({students:[{bedId:b.id,seated:true,lying:true,sleeping,character:variant}]},dt);controls.update();renderer.render(scene,camera);});
</script>
