<!doctype html><html lang="zh"><meta charset="utf-8"><title>地图接缝实景检查</title>
<style>html,body{margin:0;height:100%;font:14px sans-serif;background:#dce7e7}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;background:#fffE;padding:8px;border-radius:6px}button,select{font:inherit;padding:7px}output{position:fixed;bottom:8px;left:8px;background:#fffE;padding:8px;max-width:95vw}i{position:fixed;left:50%;top:50%;width:4px;height:4px;background:white;border:1px solid #345;border-radius:50%}[hidden]{display:none!important}</style>
<canvas></canvas><nav><select id="map"><option value="classroom">普通教室</option><option value="tiered">阶梯教室</option><option value="computer">微机房</option></select><button data-view="lift">电梯入口</button><button data-view="liftroof">电梯上框</button><button data-view="cabin">轿厢看入口</button><button data-view="rightjamb">右门框近看</button><button data-view="westrear">外窗后端封口</button><button data-view="westfront">外窗前端封口</button><button data-view="partition">走廊墙接头</button><button data-view="windowjoin">窗间接柱</button><button data-view="windowbase">窗下接柱</button><button data-view="windowback">走廊侧接柱</button><button data-view="trim">墙脚线</button><button id="door">电梯关门 / 开门</button><button id="hide">隐藏工具（` 恢复）</button></nav><i></i><output>加载正式场景…</output>
<script type="module">
import{createClassroom}from'../dist/classroom.js?v=campus-63';
import{ClassroomRound}from'../dist/classroom-rules.js?v=campus-63';
import{moveInRoom,updateLayoutDoors}from'../dist/classroom-layout.js?v=campus-63';
const canvas=document.querySelector('canvas'),out=document.querySelector('output');let failure='';window.addEventListener('error',e=>failure=e.message);window.addEventListener('unhandledrejection',e=>failure=String(e.reason?.stack||e.reason));
const render=await createClassroom(canvas,{snapEntry:true});let round,view='lift',closed=false,last=performance.now();const keys=new Set();
const views={lift:{x:9.35,z:-8.05,yaw:Math.PI,pitch:-.20},liftroof:{x:9.35,z:-9.15,yaw:Math.PI,pitch:-.70},cabin:{x:9.35,z:-12.0,yaw:0,pitch:-.35},rightjamb:{x:10.24,z:-9.12,yaw:Math.PI,pitch:-.08},westrear:{x:-6.40,z:-9.27,yaw:-2.27,pitch:-.15},westfront:{x:-6.40,z:8.05,yaw:-.70,pitch:-.45},partition:{x:8.15,z:7.85,yaw:-.80,pitch:-.25},windowjoin:{x:6.35,z:-4.765,yaw:Math.PI/2,pitch:-.15},windowbase:{x:6.35,z:-4.765,yaw:Math.PI/2,pitch:.75},windowback:{x:8.30,z:-4.765,yaw:-Math.PI/2,pitch:.20},trim:{x:6.60,z:-9.15,yaw:Math.PI/2,pitch:1.13}};
function reset(){round=new ClassroomRound({seed:4,map:document.querySelector('#map').value});round.start({gathering:true});updateLayoutDoors(round.layout,{elevatorClosed:closed,officeLocked:false});Object.assign(round.player,views[view],{seated:false,seatId:null,caught:false,captivity:'free'});}
reset();document.querySelector('#map').onchange=reset;for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;reset();};document.querySelector('#door').onclick=()=>{closed=!closed;updateLayoutDoors(round.layout,{elevatorClosed:closed});};
function hide(){document.querySelector('nav').hidden=!document.querySelector('nav').hidden;out.hidden=document.querySelector('nav').hidden;}document.querySelector('#hide').onclick=hide;
window.addEventListener('keydown',e=>{if(e.target.matches('select'))return;if(e.code==='Backquote')hide();keys.add(e.code);});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());let drag=false;canvas.onpointerdown=e=>{drag=true;canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(drag){round.player.yaw-=e.movementX*.004;round.player.pitch=Math.max(-1.3,Math.min(1.3,round.player.pitch+e.movementY*.004));}};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const p=round.player,f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),s=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));if(f||s){const n=Math.hypot(f,s),q=moveInRoom(p,(Math.sin(p.yaw)*f+Math.cos(p.yaw)*s)/n*1.8*dt,(Math.cos(p.yaw)*f-Math.sin(p.yaw)*s)/n*1.8*dt,.18,round.layout);p.x=q.x;p.z=q.z;}
 const state=round.snapshot();state.sceneElapsed=now/1000;state.elevator={doorClosed:closed};state.officeLocked=false;render.setGameplay(state);out.textContent=failure?'ERROR '+failure:`${view} · ${state.map} · 门${closed?'关闭':'开启'} · x ${p.x.toFixed(2)} / z ${p.z.toFixed(2)}\n拖动转头，WASD 使用正式碰撞；没有缩放人物或家具。`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
