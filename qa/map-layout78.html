<!doctype html><meta charset="utf-8"><title>宿舍睡姿与地图检查</title><style>body{margin:0;background:#26312d;color:#fff;font:14px sans-serif}nav{display:flex;gap:8px;padding:10px;align-items:center;flex-wrap:wrap}button{padding:8px;flex-shrink:0}canvas{display:block;width:100vw;height:calc(100vh - 60px)}output{font-size:12px;width:100%;overflow-wrap:anywhere}</style>
<nav><button id="dormhall">宿舍走廊</button><button id="sleep">睡姿近看</button><button id="sleep2">对面床</button><button id="sleep3">第三间</button><button id="toiletwide">厕所全景</button><button id="toiletseat">马桶坐下检查</button><button id="potwide">火锅全景</button><button id="bar">单杠准备</button><button id="toilet">厕所准备</button><button id="hotpot">火锅材质</button><button id="dorm">宿舍材质</button><button id="lower">下铺检查</button><button id="upper">上铺检查</button><button id="cabinet">看床边柜</button><button id="food">看柜内食物</button><button id="leavebed">下床</button><button id="use">E 互动</button><button id="return">Q 松手</button><button id="view">切换旁观</button><output id="status">加载中</output></nav><canvas></canvas>
<script type="module">
import {createClassroom} from '../dist/classroom.js?v=campus-81';
import {ClassroomRound} from '../dist/classroom-rules.js?v=campus-81';
import {interactionIntent} from '../dist/interaction-intent54.js?v=campus-81';
import {PLAYGROUND_LAYOUT} from '../dist/playground-layout70.js?v=campus-81';
import {DORM_BEDS,dormRoomPoint,dormPoint} from '../dist/dorm-layout70.js';
import {TOILET_SEATS} from '../dist/toilet-layout70.js?v=campus-81';
import {toiletBowl} from '../dist/map-activities77.js?v=campus-81';
const canvas=document.querySelector('canvas'),scene=await createClassroom(canvas),out=document.querySelector('output');
let round,observer=false,view=null,last=0,inspection=false;
function reset(map){inspection=false;round=new ClassroomRound({map,target:10000});round.start();round._advanceTeacher=()=>{};round._perceive=()=>{};round._hear=()=>{};for(const a of round.students)if(a!==round.player){a.visible=false;a._profile=null;a.isTeammate=false;}round.teacher.visible=false;observer=false;scene.setMap(map);}
function bar(){reset('playground');const b=PLAYGROUND_LAYOUT.bars[2];Object.assign(round.player,{x:b.x-.7,z:b.z,seated:false,seatId:null,yaw:Math.PI/2,pitch:-.62});view={x:b.x-2.2,z:b.z+1.5,yaw:Math.atan2(2,-1.5),pitch:.05};}
document.querySelector('#bar').onclick=bar;
document.querySelector('#toilet').onclick=()=>{reset('toilet');const id=round.player.seatId,p=round.player;Object.assign(p._slots[0],{action:'snack',progress:0,readyAt:0});round.setDrawerOpen(true);round.takeSlot(0);round.setLook(p.yaw,.55);round.hold(true);round.step(3.1);round.toggleToiletDoor(id);round.step(1);round.interact();const b=toiletBowl(id);Object.assign(p,{x:b.x+.35,z:b.z+1.20,yaw:3.098,pitch:.706});view={x:b.x-.30,z:b.z+2.65,yaw:Math.PI,pitch:.23};};
document.querySelector('#hotpot').onclick=()=>{reset('hotpot');Object.assign(round.player,{x:-1.2,z:3.3,seated:false,seatId:null,yaw:-1.92,pitch:.55});};
document.querySelector('#dorm').onclick=()=>{reset('dorm');inspection=true;for(const a of round.students)if(a!==round.player){a.visible=true;round._setBedPose(a,true);}Object.assign(round.player,{x:5.5,z:-8,seated:false,seatId:null,bedId:null,lying:false,yaw:0,pitch:.18});};
function bedReady(id){reset('dorm');const bed=round.seats[id];for(const a of round.students)if(a!==round.player){a.seated=false;a.seatId=null;}Object.assign(round.player,{x:bed.exitX,z:bed.exitZ,seated:false,seatId:null,bedId:null,lying:false,yaw:Math.atan2((id%2?bed.ladderX:bed.x)-bed.exitX,(id%2?bed.ladderZ:bed.z)-bed.exitZ),pitch:id%2?.15:.62});}
document.querySelector('#lower').onclick=()=>bedReady(0);document.querySelector('#upper').onclick=()=>bedReady(1);
document.querySelector('#cabinet').onclick=()=>{const p=round.player,b=round.seats[p.bedId??p.seatId];if(!b)return;p.yaw=Math.atan2(b.cabinetX-p.x,b.cabinetZ-p.z);p.pitch=Math.atan2(b.supportHeight+.23-b.cabinetY-.5,Math.hypot(b.cabinetX-p.x,b.cabinetZ-p.z));};
document.querySelector('#food').onclick=()=>{const p=round.player,b=round.seats[p.bedId??p.seatId];if(!b)return;const food=dormPoint({x:b.cabinetX,z:b.cabinetZ,yaw:b.cabinetYaw},-.09,.045);p.yaw=Math.atan2(food.x-p.x,food.z-p.z);p.pitch=Math.atan2(b.supportHeight+.23-b.foodY-.09,Math.hypot(food.x-p.x,food.z-p.z));};
document.querySelector('#leavebed').onclick=()=>round.interact();

function use(key){const intent=interactionIntent(round.snapshot(),scene.getInteraction(),key);if(intent)round[intent.method](...(intent.args||[]));}
document.querySelector('#use').onclick=()=>use('E');document.querySelector('#return').onclick=()=>use('Q');document.querySelector('#view').onclick=()=>observer=!observer;
const keys=new Set();document.addEventListener('keydown',e=>{keys.add(e.code);if(!e.repeat&&['KeyE','KeyQ'].includes(e.code))use(e.code.slice(-1));});document.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='KeyE'&&round.player.mapActivity?.kind==='plunge')round.releaseMapActivity();});canvas.onclick=()=>canvas.requestPointerLock();document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;const p=observer?view:round.player;if(!p)return;p.yaw-=e.movementX*.0024;p.pitch=Math.max(-1.3,Math.min(1.3,p.pitch+e.movementY*.0021));});
function inspect(map,eye,point){reset(map);inspection=true;Object.assign(round.player,{x:eye.x,z:eye.z,seated:false,seatId:null,bedId:null,lying:false,yaw:Math.atan2(point.x-eye.x,point.z-eye.z),pitch:Math.atan2(1.95-(point.y??1.2),Math.hypot(point.x-eye.x,point.z-eye.z))});}
function sleep(id){const b=DORM_BEDS[id],eye=dormPoint({x:b.lieX,z:b.lieZ,yaw:b.bunkYaw},0,2.0);inspect('dorm',eye,{x:b.lieX,z:b.lieZ,y:.99});for(const a of round.students){if(a===round.player)continue;a.visible=false;}const a=round.students.find(a=>a!==round.player);Object.assign(a,{bedId:id,seatId:id,seated:true,visible:true});round._setBedPose(a,true);a.character='boy';}
document.querySelector('#sleep').onclick=()=>sleep(0);document.querySelector('#sleep2').onclick=()=>sleep(4);document.querySelector('#sleep3').onclick=()=>sleep(16);
document.querySelector('#dormhall').onclick=()=>inspect('dorm',{x:10.1,z:5.4},{x:10.1,z:-10,y:1.7});
document.querySelector('#toiletseat').onclick=()=>{reset('toilet');const b=TOILET_SEATS[9];for(const a of round.students){a.seated=false;a.seatId=null;}Object.assign(round.player,{x:b.x,z:b.z+1.15,seated:false,seatId:null,yaw:Math.PI,pitch:Math.atan2(1.53-b.y,1.15)});round.toiletDoors[9]=1;round._toiletDoorTargets[9]=1;};
document.querySelector('#toiletwide').onclick=()=>inspect('toilet',{x:5.9,z:5.9},{x:-.5,z:-4,y:1.2});
document.querySelector('#potwide').onclick=()=>inspect('hotpot',{x:5.9,z:5.7},{x:-.6,z:-3.5,y:1.2});
sleep(0);function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;const p=round.player,f=+keys.has('KeyW')-keys.has('KeyS'),s=+keys.has('KeyD')-keys.has('KeyA');round.setMovement(Math.sin(p.yaw)*f-Math.cos(p.yaw)*s,Math.cos(p.yaw)*f+Math.sin(p.yaw)*s);round.step(dt);const state=round.snapshot();if(inspection){state.role='teacher';state.teacher={...state.teacher,...state.player};}if(observer&&view){state.player={...state.player,...view,id:-999,mapActivity:null,seated:false};state.role='teacher';}scene.setGameplay(state);const target=scene.getInteraction();out.textContent=JSON.stringify({map:round.map,xyz:[p.x,p.z,p.yaw,p.pitch],view:observer?'旁观':'第一人称',target:target?.kind,id:target?.id,seated:p.seated,bed:p.bedId,sleeping:p.sleeping,lying:p.lying,drawer:state.drawer?.open,held:state.drawer?.drawnSlot,activity:p.mapActivity?.kind,progress:p.mapActivity?.progress,clogs:round.toiletClogs});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
