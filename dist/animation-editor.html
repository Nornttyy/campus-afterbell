<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手部动作编辑器</title><link rel="stylesheet" href="./animation-editor59.css?v=campus-80"></head>
<body>
<header class="appbar"><a class="brand" href="./index.html?v=campus-80" aria-label="返回游戏">‹</a><div><h1>手部动作</h1><span id="save-state">本机草稿</span></div><div class="top-actions"><button id="undo" title="撤销 ⌘/Ctrl Z" aria-label="撤销">↶</button><button id="redo" title="重做 ⌘/Ctrl Shift Z" aria-label="重做">↷</button><button id="export">导出</button><label class="file-button">导入<input id="import" type="file" accept=".json,application/json"></label><button id="apply" class="primary">保存到游戏</button></div></header>
<main class="workspace">
<aside class="clips"><p class="eyebrow">动作</p><div role="group" aria-label="选择动作"><button data-clip="student-idle" class="clip active"><span>01</span><strong>学生待机</strong></button><button data-clip="student-walk" class="clip"><span>02</span><strong>学生走路</strong></button><button data-clip="student-crawl-idle" class="clip"><span>03</span><strong>学生爬行待机</strong></button><button data-clip="student-crawl" class="clip"><span>04</span><strong>学生爬行移动</strong></button><button data-clip="teacher-idle" class="clip"><span>05</span><strong>老师待机</strong></button><button data-clip="teacher-walk" class="clip"><span>06</span><strong>老师走路</strong></button></div><div class="clip-settings"><label>一轮时长 <span><input id="duration" type="number" min="0.2" max="20" step="0.1" value="1.4"> 秒</span></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label><label>衔接<select id="easing"><option value="smoothstep">柔和</option><option value="linear">匀速</option><option value="step">逐帧</option></select></label></div><details class="help"><summary>怎么做</summary><p>从静止姿势开始。拖动时间线，调整手的位置和朝向，就会记录关键帧。</p><p>空格播放 · K 加帧<br>方向键逐帧 · Delete 删帧<br>⌘ / Ctrl Z 撤销</p><p>保存只影响当前浏览器。导出文件可以备份或交给我接入。</p></details><button id="restore" class="quiet">清空当前动作</button><button id="disable-custom" class="quiet">停用自定义动作</button></aside>
<section class="preview" aria-label="动作预览"><div class="viewbar"><div class="segmented" role="group" aria-label="预览角度"><button data-view="first" aria-pressed="true">第一人称</button><button data-view="side" aria-pressed="false">侧面</button><button data-view="front" aria-pressed="false">正面</button></div><div class="view-options"><label><input id="grid" type="checkbox" checked>网格</label><label><input id="show-path" type="checkbox">轨迹</label><label><input id="show-gizmo" type="checkbox" checked>控制柄</label></div></div><div id="viewport"><canvas id="editor-canvas" aria-label="真实游戏手部模型"></canvas><div id="loading" role="status">正在载入游戏手模…</div><div class="viewport-note"><span id="view-label">学生 · 第一人称</span><span id="preview-time">0.00 s</span></div><div class="crosshair" aria-hidden="true"></div></div><div id="notice" role="status" aria-live="polite">选择一只手，拖动控制柄或调整右侧数值。</div></section>
<aside class="inspector"><div class="segmented" role="group" aria-label="编辑哪只手"><button data-side="left" aria-pressed="true">左手</button><button data-side="right" aria-pressed="false">右手</button></div><div class="segmented tools" role="group" aria-label="控制柄模式"><button data-tool="translate" aria-pressed="true">移动</button><button data-tool="rotate" aria-pressed="false">旋转</button></div><fieldset><legend>位置 <small>厘米</small></legend><div id="position-fields" class="triple"></div></fieldset><fieldset><legend>朝向 <small>度</small></legend><div id="rotation-fields" class="triple"></div></fieldset><label class="slider-label">握紧 <output id="curl-output">20%</output><input id="curl" type="range" min="0" max="1" step="0.01" value=".2"></label><details><summary>手指</summary><div id="finger-fields"></div></details><div class="button-pair"><button id="mirror">镜像到另一只手</button><button id="swap">左右互换</button></div><details><summary>关键帧</summary><label>时间 <input id="frame-time" type="number" min="0" step="0.01" value="0"> 秒</label><div class="button-pair"><button id="copy-pose">复制姿势</button><button id="paste-pose">粘贴姿势</button></div><button id="duplicate">复制到下一帧</button></details><details><summary>预览设置</summary><label>播放速度<select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label>视线俯仰<input id="look-pitch" type="range" min="-15" max="70" step="1" value="0"></label><button id="view-reset">重置视角</button></details></aside>
<section class="timeline" aria-label="动画时间线"><div class="timeline-toolbar"><div class="transport"><button id="to-start" aria-label="回到开头">|‹</button><button id="play" class="play" aria-label="播放">▶</button><button id="to-end" aria-label="移到末尾">›|</button><span id="time-text">0.00 / 1.40 s</span></div><div><button id="add-frame">＋关键帧</button><button id="delete-frame">删除帧</button></div></div><div class="track-area"><div id="ruler" aria-hidden="true"></div><div id="track" role="group" aria-label="关键帧时间线"><div class="track-line"></div><div id="keys"></div><div id="playhead" aria-hidden="true"></div></div><input id="scrubber" type="range" min="0" max="1.4" step="0.01" value="0" aria-label="播放位置"></div><footer><span id="frame-count">0 个关键帧</span><span>改动自动保留草稿 · 保存到游戏后生效</span></footer></section>
</main><script type="module" src="./animation-editor59.js?v=campus-80"></script></body></html>
