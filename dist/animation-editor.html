<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8f7"><title>手部动作编辑器</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232d786c'/%3E%3Cpath d='M16 18h32v25H16z' fill='%23fff6dd'/%3E%3Cpath d='M25 49h14M32 43v6M24 27h16M24 34h10' stroke='%232d786c' stroke-width='4'/%3E%3C/svg%3E"><link rel="stylesheet" href="./animation-editor59.css?v=campus-111"></head>
<body>
<header class="appbar"><a class="brand" href="./index.html?v=campus-117" aria-label="返回游戏">‹</a><div><h1>手部动作</h1><span id="save-state">本机草稿</span></div><div class="top-actions">
<button id="undo" title="撤销 Ctrl / ⌘ Z" aria-label="撤销">↶</button><button id="redo" title="重做 Ctrl / ⌘ Shift Z" aria-label="重做">↷</button>
<details class="file-menu"><summary>文件</summary><div><button id="export-one">导出当前动作</button><button id="export">备份全部动作</button><label class="file-button">导入动作<input id="import" type="file" accept=".json,application/json"></label></div></details>
<button id="apply" class="primary" title="将当前动作保存到这个浏览器的游戏">应用到本机游戏</button></div></header>
<main class="workspace">
<section class="preview" aria-label="动作预览"><div class="viewbar">
<label class="action-picker">动作<select id="clip-select">
<optgroup label="学生"><option value="student-idle" data-clip="student-idle">学生待机</option><option value="student-walk" data-clip="student-walk">学生走路</option><option value="student-crawl-idle" data-clip="student-crawl-idle">学生爬行待机</option><option value="student-crawl" data-clip="student-crawl">学生爬行移动</option><option value="student-carry-food" data-clip="student-carry-food">拿着食物</option><option value="student-eat-food" data-clip="student-eat-food">吃东西</option></optgroup>
<optgroup label="老师"><option value="teacher-idle" data-clip="teacher-idle">老师待机</option><option value="teacher-walk" data-clip="teacher-walk">老师走路</option></optgroup></select></label>
<label id="item-picker" hidden>预览物品<select id="preview-item"><option value="chips">没事薯片</option><option value="gum">泡泡堂</option><option value="noodles">小困熊干脆面</option><option value="snack">辣条</option><option value="burger">汉堡</option><option value="drink">饮料</option></select></label>
<div class="segmented" role="group" aria-label="预览角度"><button data-view="first" aria-pressed="true">第一人称</button><button data-view="side" aria-pressed="false">侧面</button><button data-view="front" aria-pressed="false">正面</button></div></div>
<div id="viewport"><canvas id="editor-canvas" aria-label="拖动手掌调整姿势" tabindex="0"></canvas><div id="loading" role="status">正在载入游戏手模…</div><div class="viewport-note"><span id="view-label"></span><span id="preview-time">0.00 s</span></div><div class="crosshair" aria-hidden="true"></div></div>
<div id="notice" role="status" aria-live="polite">拖动手掌摆姿势，拖动时间线后可继续摆下一帧。</div></section>
<aside class="inspector"><h2>手部姿势</h2><div class="segmented" role="group" aria-label="编辑哪只手"><button data-side="left" aria-pressed="true">左手</button><button data-side="right" aria-pressed="false">右手</button></div>
<div class="segmented tools" role="group" aria-label="拖动模式"><button data-tool="translate" aria-pressed="true">移动</button><button data-tool="rotate" aria-pressed="false">旋转</button></div>
<label class="slider-label">前后位置 <output id="depth-output"></output><input id="depth" type="range" min="-200" max="200" step="1" aria-label="手的前后位置"></label>
<label class="slider-label">握紧 <output id="curl-output">20%</output><input id="curl" type="range" min="0" max="1" step="0.01" value=".2"></label>
<button id="mirror" class="mirror">镜像到另一只手</button>
<details><summary>手指与精确数值</summary><div id="finger-fields"></div><fieldset><legend>位置 <small>厘米</small></legend><div id="position-fields" class="triple"></div></fieldset><fieldset><legend>朝向 <small>度</small></legend><div id="rotation-fields" class="triple"></div></fieldset><button id="swap">左右互换</button></details>
<details><summary>时间与播放</summary><label>一轮时长（秒）<input id="duration" type="number" min=".2" max="20" step=".1"></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label><label>衔接<select id="easing"><option value="smoothstep">柔和</option><option value="linear">匀速</option><option value="step">瞬间切换</option></select></label><label>播放速度<select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label>帧时间（秒）<input id="frame-time" type="number" min="0" step=".01"></label><div class="button-pair"><button id="copy-pose">复制姿势</button><button id="paste-pose">粘贴姿势</button></div></details>
<details><summary>预览与工具</summary><label class="check"><input id="grid" type="checkbox" checked>显示网格</label><label class="check"><input id="show-path" type="checkbox">显示轨迹</label><label class="check"><input id="show-gizmo" type="checkbox">使用轴向控制柄</label><label>视线俯仰<input id="look-pitch" type="range" min="-15" max="70" step="1" value="0"></label><button id="view-reset">重置视角</button><button id="restore" class="quiet">清空当前动作</button><button id="disable-custom" class="quiet">停用本机自定义动作</button></details></aside>
<section class="timeline" aria-label="动画时间线"><div class="timeline-toolbar"><div class="transport"><button id="to-start" aria-label="回到开头">|‹</button><button id="play" class="play" aria-label="播放">▶</button><button id="to-end" aria-label="移到末尾">›|</button><span id="time-text"></span></div><div class="frame-tools"><button id="add-frame">加帧</button><button id="duplicate" title="从这里复制姿势到下一个空时间点">复制到下一帧</button><button id="delete-frame">删帧</button></div></div>
<div class="track-area"><div id="ruler" aria-hidden="true"></div><div id="track" role="group" aria-label="关键帧时间线"><div class="track-line"></div><div id="keys"></div><div id="playhead" aria-hidden="true"></div></div><input id="scrubber" type="range" min="0" max="1.4" step=".01" value="0" aria-label="播放位置"></div><footer><span id="frame-count"></span><span>空格播放 · 拖动菱形调整帧时间</span></footer></section>
</main><script type="module" src="./animation-editor59.js?v=campus-117&amp;rev=169"></script></body></html>
